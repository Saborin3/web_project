<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート試験 公開問題 一問一答</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#38bdf8;
    --good:#22c55e;
    --bad:#ef4444;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --border:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e293b 60%,#0f172a);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px 60px;
  }
  .wrap{
    width:100%;
    max-width:720px;
  }
  h1{
    font-size:1.3rem;
    text-align:center;
    margin:0 0 4px;
    color:var(--text);
  }
 h2{
   font-size:0.5rem
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:14px;
  }
  .yearbar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .yearbar label{
    font-size:0.85rem;
    color:var(--muted);
  }
  .yearbar select{
    background:#0b1220;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 12px;
    font-size:0.95rem;
    font-weight:bold;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .progress-wrap{
    flex:1;
    min-width:150px;
    background:#0b1220;
    border-radius:999px;
    height:10px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .progress-bar{
    height:100%;
    background:linear-gradient(90deg,var(--accent),#818cf8);
    width:0%;
    transition:width .3s ease;
  }
  .stat{
    font-size:0.85rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .score{
    color:var(--accent);
    font-weight:bold;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 20px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .qno{
    display:inline-block;
    background:#0b1220;
    color:var(--accent);
    font-weight:bold;
    padding:4px 12px;
    border-radius:999px;
    font-size:0.85rem;
    margin-bottom:12px;
    border:1px solid var(--border);
  }
  .qtext{
    font-size:1.02rem;
    line-height:1.75;
    white-space:pre-wrap;
    margin-bottom:18px;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:#0b1220;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
    font-size:0.95rem;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .choice:hover{
    border-color:var(--accent);
  }
  .choice:active{
    transform:scale(0.99);
  }
  .choice .label{
    flex-shrink:0;
    font-weight:bold;
    color:var(--accent);
    background:#111c33;
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.9rem;
  }
  .choice.correct{
    border-color:var(--good);
    background:rgba(34,197,94,.12);
  }
  .choice.correct .label{
    background:var(--good);
    color:#04150a;
  }
  .choice.wrong{
    border-color:var(--bad);
    background:rgba(239,68,68,.12);
  }
  .choice.wrong .label{
    background:var(--bad);
    color:#210505;
  }
  .choice.disabled{
    cursor:default;
    opacity:0.85;
  }
  .result-box{
    margin-top:18px;
    padding:14px 16px;
    border-radius:12px;
    display:none;
    font-size:0.95rem;
    line-height:1.7;
  }
  .result-box.show{
    display:block;
    animation:fadein .25s ease;
  }
  .result-box.ok{
    background:rgba(34,197,94,.12);
    border:1px solid var(--good);
  }
  .result-box.ng{
    background:rgba(239,68,68,.12);
    border:1px solid var(--bad);
  }
  .result-title{
    font-weight:bold;
    margin-bottom:6px;
    font-size:1rem;
  }
  .result-title.ok{color:var(--good);}
  .result-title.ng{color:var(--bad);}
  @keyframes fadein{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .nav{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
  }
  button.navbtn{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0b1220;
    color:var(--text);
    font-size:0.95rem;
    cursor:pointer;
    transition:background .15s;
  }
  button.navbtn:hover:not(:disabled){
    background:#111c33;
  }
  button.navbtn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  button.primary{
    background:var(--accent);
    color:#04202c;
    font-weight:bold;
    border:none;
  }
  button.primary:hover{
    filter:brightness(1.08);
  }
  .jumpwrap{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .jumpwrap label{
    font-size:0.8rem;
    color:var(--muted);
  }
  select{
    background:#0b1220;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
  }
  .finish-screen{
    text-align:center;
    padding:30px 10px;
  }
  .finish-screen .big{
    font-size:2.4rem;
    font-weight:bold;
    color:var(--accent);
    margin:10px 0;
  }
  .resetbtn{
    margin-top:20px;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ITパスポート試験 公開問題</h1>
  <h2>開発メンバー</h2>
  <p>学生Aこたろんリーダー担当</p>
  <p>学生Bちゃむりん助手担当</p>

  <div class="subtitle">一問一答形式（問1〜問100）／出典：独立行政法人情報処理推進機構（IPA）公開問題</div>

  <div class="yearbar">
    <label for="yearSelect">年度：</label>
    <select id="yearSelect">
      <option value="r8">令和8年度</option>
      <option value="r7">令和7年度</option>
      <option value="r6">令和6年度</option>
    </select>
  </div>

  <div class="topbar">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="stat">問 <span id="curNo">1</span> / 100　正解 <span class="score" id="scoreNo">0</span></div>
  </div>

  <div class="card" id="quizCard">
    <span class="qno" id="qnoLabel">問1</span>
    <div class="qtext" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="result-box" id="resultBox">
      <div class="result-title" id="resultTitle"></div>
      <div id="resultExp"></div>
    </div>
    <div class="nav">
      <button class="navbtn" id="prevBtn">← 前の問題</button>
      <button class="navbtn primary" id="nextBtn">次の問題 →</button>
    </div>
    <div class="jumpwrap">
      <label for="jumpSelect">問題へジャンプ：</label>
      <select id="jumpSelect"></select>
    </div>
  </div>

  <div class="card finish-screen" id="finishCard" style="display:none;">
    <div>お疲れさまでした！</div>
    <div class="big"><span id="finalScore">0</span> / 100</div>
    <div id="finalComment" style="color:var(--muted);"></div>
    <button class="navbtn primary resetbtn" id="restartBtn">もう一度最初から解く</button>
  </div>

  <footer>擬似言語・表計算ソフトの記述形式はIPA公開の規約に準拠。正解はIPA公表の解答例に基づく。解説は本アプリ作成者による要約です。</footer>
</div>

<script>
// 0:ア 1:イ 2:ウ 3:エ

// ============ 令和8年度 ============
const Q_R8 = [
{q:`生成AIを用いた生成物の取扱いに関して，既存の著作物の著作権者から許諾を得ることが必要となる可能性のあるものだけを，全て挙げたものはどれか。

a　好みのアーティストの楽曲に似た音楽が得られるように生成AIを用いて楽曲を生成し，その楽曲をインターネット上にアップロードし，無料で公開した。
b　好みのアーティストの楽曲に似た音楽が得られるように生成AIを用いて楽曲を生成し，その楽曲を自分のPC上に保管し，個人で視聴した。
c　生成AIで音楽を生成したところ，偶然好みのアーティストの楽曲に似た音楽が生成できたので，自分のPC上に保管し，個人で視聴した。`,
c:["a","a, b","a, b, c","b, c"],a:0,
e:"個人的な視聴（私的複製の範囲）では著作権者の許諾は不要ですが，ネット上に公開するとその音楽が既存の著作物に類似・依拠している場合，著作権侵害となり得るため許諾が必要になる可能性があります。"},

{q:"BYODに関する記述として，適切なものはどれか。",
c:["企業の業務に，従業員が私物の携帯情報端末を許可を得た上で利用すること","企業の業務の定型的な作業をソフトウェアのロボットで効率化すること","企業の業務の流れを分析し，継続的に改善，最適化していくこと","企業の業務の流れを見直し，抜本的にデザインし直すこと"],a:0,
e:"BYOD（Bring Your Own Device）は私物端末を許可を得て業務利用することです。イはRPA，ウはBPM，エはBPRの説明です。"},

{q:"投資会社であるA社が，それぞれの投資戦略を採る場合の利益は，表のように予想される。A社がマクシミン戦略を採り，かつ，市況が好転した場合の利益はどれか。マクシミン戦略とは，戦略ごとに予想される利益の最小値が最も大きくなるように戦略を採用する理論である。\n\n　　　　　　市況が好転　市況が悪化\n投資戦略a　　20　　　　　−15\n投資戦略b　　5　　　　　　0",
c:["−15","0","5","20"],a:2,
e:"戦略aの最小値は−15，戦略bの最小値は0。最小値が大きいbを採用するため，市況好転時の利益は5になります。"},

{q:"特定の目的の達成や課題の解決をテーマとして，ソフトウェアの開発者や企画者などが短期集中的にアイディアを出し合い，ソフトウェアの開発などの共同作業を行い，成果を競い合うイベントはどれか。",
c:["トレードフェア","ハッカソン","パネルディスカッション","レセプション"],a:1,
e:"短期集中でソフトウェア開発を競い合うイベントはハッカソンです。"},

{q:"インターネットを利用した企業広告に関する新たなビジネスモデルを知的財産として出願し，コンピュータシステムとして実現した。このビジネスモデルを知的財産として，保護する法律はどれか。",
c:["意匠法","実用新案法","著作権法","特許法"],a:3,
e:"ビジネスモデル特許はコンピュータシステムとして実現されたビジネス方法を特許法で保護します。"},

{q:"デジタルトランスフォーメーションに関する説明として，最も適切なものはどれか。",
c:["PCやスマートフォンなどのデジタル製品を使いこなせる人と，使いこなせない人の間で様々な機会に差が生じて，社会的な格差につながること","生まれた時からインターネット，PCやスマートフォンなどのデジタル製品が身近にあり，それらを利用しながら育った世代のこと","音声を収集するマイクロフォンなどからのアナログ信号を，電子ファイルとして保存するためにデジタル信号に変換すること","デジタル技術が，人間の生活やビジネスなどのあらゆる面に影響を与え，変革をもたらしていくこと"],a:3,
e:"アはデジタルデバイド，イはデジタルネイティブ，ウはデジタル化（アナログ→デジタル変換）の説明です。DXはデジタル技術による社会・ビジネスの変革を指します。"},

{q:"製品やサービスの価値を機能とコストの関係で把握し，価値の向上をはかる“バリューエンジニアリング”という手法がある。バリューエンジニアリングにおける価値，機能，コストの関係性を示すものとして，適切なものはどれか。",
c:["価値＝機能／（コスト＋機能）","価値＝機能／コスト","価値＝機能×コスト","価値＝コスト／機能"],a:1,
e:"バリューエンジニアリングでは 価値＝機能／コスト と定義されます。"},

{q:"IoTを利用したシステムの事例として，最も適切なものはどれか。",
c:["資金調達において，不特定多数の借り手と貸し手をインターネット上で仲介するサービスを行う。","ソーシャルメディアへの書込みや，コールセンターの通話内容などから，商品やサービスに対する利用者の感情を分析する。","店舗や工場などの設備に設置したセンサーの情報をインターネット経由で集め，設備の状況について，従業員がスマートフォンを用いて監視する。","文書や画像などの電子ファイルを保存するためのインターネット上のストレージを，サービスとして提供する。"],a:2,
e:"センサーで取得した情報をネットワーク経由で収集・監視するのがIoTの典型例です。アはクラウドファンディング，イはテキストマイニング，エはクラウドストレージの説明です。"},

{q:"製品の製造に関連して発生する次の費用のうち，間接費だけを全て挙げたものはどれか。\n\na　完成した製品を検査する労務費\nb　工場の電気供給設備を保守する労務費\nc　製品の外注加工費",
c:["a, b","b","b, c","c"],a:1,
e:"検査労務費(a)と外注加工費(c)は特定製品に直接紐づく直接費，工場全体の設備保守費(b)は間接費です。"},

{q:"会議に関する記述のうち，ブレーンストーミングの進め方として，適切なものだけを全て挙げたものはどれか。\n\na　自由奔放なアイディアは控え，実現可能なアイディアの提出を求める。\nb　ほかのメンバーのアイディアに便乗した案であっても，とがめずに進める。\nc　メンバーから出されるアイディアの中で，テーマに適したものを選択しながら進める。",
c:["a","a, b","a, b, c","b"],a:3,
e:"ブレーンストーミングは自由奔放（批判禁止・便乗歓迎・質より量）が原則です。aやcのような制限・選別は原則に反します。"},

{q:"プロサッカーチームのファンの集いで，人気のある選手が背広姿でサインをしている姿を撮影し，プリントしてフリーマーケットで販売した。この行為によって侵害されるおそれがある選手が有する権利として，最も適切なものはどれか。",
c:["意匠権","商標権","著作権","パブリシティ権"],a:3,
e:"著名人の氏名・肖像が持つ経済的価値を保護する権利がパブリシティ権です。"},

{q:"A社は，自社の業務プロセスの課題を抽出し，見直しをするために流れ図を用いて業務プロセスを可視化することにした。A社が流れ図の作成において利用する記述様式として，最も適切なものはどれか。",
c:["CRUD図","DMM（Diamond Mandala Matrix）","E-R図","WFA（Work Flow Architecture）"],a:3,
e:"業務プロセスを流れ図として可視化する記述様式はWFAです。"},

{q:"個人情報保護法に規定された匿名加工情報の説明として，最も適切なものはどれか。",
c:["厚生労働省や総務省統計局などが公開している統計情報を自社向けに加工し，自社の保有する情報とひも付けて新たな価値をもたせた情報","個人情報のうち氏名を一定の規則に基づいて匿名化するが，元の個人情報への復元を担保した情報","個人情報を法令に定める方法で匿名化し，復元できないようにしたもので，一定のルールの下で本人の同意なく利活用できる情報","利用者から個人情報を収集する際に，氏名を取得せず個人番号などほかの情報で個人を識別できるようにして収集した情報"],a:2,
e:"匿名加工情報は法令の方法で復元不可能に加工し，本人同意なしで一定ルールの下利活用できる情報です。"},

{q:"ISO 26000とは，組織の社会的責任についての国際規格である。ISO 26000で定められている，企業が果たすべき社会的責任を表す用語として，最も適切なものはどれか。",
c:["CSR","SDGs","コーポレートガバナンス","ソーシャルメディアポリシー"],a:0,
e:"企業の社会的責任を表す用語はCSR（Corporate Social Responsibility）です。"},

{q:"マーケティングにおけるイノベーター理論では，新しい製品やサービスが普及していく過程に沿って，消費者を，イノベーター，アーリーアダプター，アーリーマジョリティ，レイトマジョリティ，ラガードという五つのグループに分ける。このとき，アーリーアダプターからアーリーマジョリティへの普及において生じる，越えることが困難な隔たりを表す用語として，最も適切なものはどれか。",
c:["カニバリゼーション","キャズム","死の谷","レッドオーシャン"],a:1,
e:"アーリーアダプターとアーリーマジョリティの間の溝はキャズムと呼ばれます。"},

{q:"教師あり学習において，正解となる情報を付与する作業を表す用語として，最も適切なものはどれか。",
c:["アノテーション","エンコード","データクレンジング","フィルタリング"],a:0,
e:"データに正解ラベルを付与する作業はアノテーションと呼ばれます。"},

{q:"AIを利活用する上で留意すべき事項として，適切なものだけを全て挙げたものはどれか。\n\na　AIの意図しない動作によって，人間の生命や身体などに危害を及ぼす可能性\nb　AIの判断に差別的な内容が含まれる可能性\nc　AIの判断にプライバシーの侵害となる内容が含まれる可能性",
c:["a, b","a, b, c","a, c","b, c"],a:1,
e:"a・b・cいずれもAI利活用における重要な留意事項です。"},

{q:"コンカレントエンジニアリングを採用する目的として，最も適切なものはどれか。",
c:["開発期間や納期の短縮","開発製品におけるセキュリティの確保","開発製品の省エネルギー性能の確保","開発製品への最新技術の活用"],a:0,
e:"複数工程を並行して進めることで開発期間・納期を短縮するのがコンカレントエンジニアリングの目的です。"},

{q:"サーバ上にインストールされたアプリケーションソフトウェアを，インターネット経由で利用者に提供する事業者，又はそのサービス形態として，適切なものはどれか。",
c:["ASP","ISP","アウトソーシング","データウェアハウス"],a:0,
e:"アプリケーションをネット経由で提供する事業者・形態はASP（Application Service Provider）です。"},

{q:"システム開発におけるRFPの説明として，適切なものはどれか。",
c:["ITベンダーが，情報システム開発の必要性をユーザーに提案するために作成した提案文書","発注者側が，開発すべき情報システムの調達条件などをITベンダーに示すために作成した文書","発注者と受注したITベンダーが，開発するシステムの仕様を明確にするために共同で作成した設計文書","ユーザー部門が，情報システム部門に情報システム開発の必要性と開発要件を明確にするように求めた文書"],a:1,
e:"RFP（提案依頼書）は発注者が調達条件をITベンダーに示すための文書です。"},

{q:"サイバーセキュリティ基本法の立法趣旨を説明したものはどれか。",
c:["コンピュータへの不正アクセス行為を定義し，その行為を禁止するとともに罰則を定め，ネットワーク通信秩序の維持を図ること","情報セキュリティに関する適切なコントロールを整備，運用するための実践的な規範を定め，企業などで効果的な情報セキュリティ対策の推進を促すこと","情報通信ネットワークを通じたコンピュータへの不正侵入などの行為に対する防御施策に関し，基本理念を定め，国及び地方公共団体の責務などを明らかにして，施策の総合的かつ効果的な推進を図ること","デジタルコンテンツの複製防止のための技術的制限手段を無効化する行為などを規制することによって，企業などの営業上の利益を確保すること"],a:2,
e:"サイバーセキュリティ基本法は，国・地方公共団体の責務等を定め施策を総合的・効果的に推進することを趣旨とします。アは不正アクセス禁止法，イはISMS等の規範，エは著作権法（技術的制限手段）の説明です。"},

{q:"伝票入力処理などの定型的な事務作業を，ソフトウェアロボットに代替させることによって，自動化や効率化を図る手段として，最も適切なものはどれか。",
c:["BPO","EUC","FA","RPA"],a:3,
e:"ソフトウェアロボットによる定型業務の自動化はRPAです。"},

{q:"インターネット広告の手法の一つである，リスティング広告に関する記述として，最も適切なものはどれか。",
c:["Webサイトの閲覧履歴やオンラインショッピングの購買履歴などの利用者の行動履歴を基にして，広告を表示する。","検索エンジンの利用者が検索ボックスに入力したキーワードに連動して，広告を表示する。","事前に広告メールの受信を許諾した利用者に対して，広告メールを配信する。","定期的に発行するメールマガジンに，広告を掲載して配信する。"],a:1,
e:"検索キーワードに連動して広告を表示するのがリスティング広告です。"},

{q:"コーポレートガバナンスの説明として，適切なものはどれか。",
c:["株主を始めとした利害関係者による経営者への監視や監督を中心とした，企業活動を律する枠組みのこと","企業が活動を行う上で必要な資本の調達のこと","企業の理念や特性を，統一されたイメージやデザインなどで発信し，企業のブランド価値の向上を図ること","競合他社では提供が不可能な価値をもたらす，企業が有する独自のスキルや技術のこと"],a:0,
e:"コーポレートガバナンスは利害関係者による経営監視の枠組みを指します。"},

{q:"大容量，頻繁な更新，多種多様という三つの要素をもつ情報資産を“ビッグデータ”と定義する考え方がある。このビッグデータを特徴づける三つの要素を総称して何というか。",
c:["3C","3D","3G","3V"],a:3,
e:"Volume・Velocity・Variety の頭文字から3Vと呼ばれます。"},

{q:"表はA社の貸借対照表である。A社の自己資本比率は何％か。\n\n（単位　百万円）\n資産の部：流動資産730　固定資産270\n負債の部：流動負債200　固定負債500\n純資産の部：資本金300",
c:["30","54","70","90"],a:0,
e:"総資産＝730+270=1000。自己資本（純資産）＝1000－(200+500)=300。自己資本比率＝300/1000=30%。"},

{q:"AIを，様々な課題に対して判断できる“強いAI”と，特定の課題だけを判断できる“弱いAI”に分類した場合，“弱いAI”の記述として，最も適切なものはどれか。",
c:["人間と同等の知能がコンピュータ上で再現され，人間のように判断することができるが，人間と同じような判断ミスをすることもある。","人間のように質問そのものの意味を理解したり，考えたりしているわけではないが，判断の結果を示すことはできる。","人間よりも賢く，人間の手助けがなくても自らの判断力を高めることができる。","自らがもつ知識や能力を自律的に適用することによって，柔軟に判断できる能力がある。"],a:1,
e:"弱いAIは意味理解を伴わないが，特定タスクの判断結果は出力できます。"},

{q:"インターネット上の商取引に関連したリスクのうち，エスクローサービスを利用することによって低減できるリスクとして，適切なものはどれか。",
c:["オークションサイトに誤った購入金額を入力したときに，取引を取り消せない。","商品の代金を支払ったにもかかわらず，商品が配送されない。","ショッピングサイトで使用しているパスワードが漏えいする。","発注した商品を一旦受け取ると，自己都合では解約できない。"],a:1,
e:"エスクローサービスは第三者が代金を一時預かることで代金支払い後に商品が届かないリスクを低減します。"},

{q:"プログラム開発業務の委託に当たり，請負契約における注文者及び請負業者の権利や義務について特段の取決めがない場合の説明として，適切なものはどれか。",
c:["請負業者が，更に別の業者に仕事の一部を請け負わせる場合は，事前に注文者の承諾を得なければならない。","完成したプログラムに欠陥があるときは，注文者はいつでも欠陥の改修を請求することができる。","注文者には，プログラムの引渡しを受けた時点で，報酬を支払う義務が生じる。","注文者は，プログラムの完成前であればいつでも請負業者に対して損害を賠償することなく請負契約を解除することができる。"],a:2,
e:"請負契約では成果物引渡し時に報酬支払義務が発生するのが原則です。"},

{q:"事業部制組織の事例はどれか。",
c:["Aさんは X事業を実施している部門の購買組織に所属している。Y事業の購買はY事業を実施している部門の購買組織が担当している。","Bさんは複数の事業の人事機能を担当する組織に所属している。開発，生産，販売機能も同様に，それぞれ専門の組織が担当している。","Cさんは地域Mで製品Xの販売を担当しており，地域Mの販売に責任をもつ上司と製品Xの販売に責任をもつ上司の，2人の上司の指示を受けている。","Dさんは新規事業の企画開発を目的として関係部署から横断的に人材を集めた組織に所属している。この組織は企画開発が終わり次第解散する。"],a:0,
e:"事業ごとに購買・開発・販売などの機能が独立して存在するのが事業部制です。イは機能別組織，ウはマトリックス組織，エはプロジェクト組織の例です。"},

{q:"リーン生産方式による業務改善の観点であるムリ，ムラ，ムダのうち，ムダに当たるものとして，最も適切なものはどれか。",
c:["属人化していて，担当者によって作成物の品質が異なる作業","組織の能力以上に負荷をかける無謀な計画や作業標準","待機や必要以上の加工など，付加価値を生まない動作","長時間，身体の一部に負担がかかり，健康を害するおそれのある作業"],a:2,
e:"付加価値を生まない動作（待機・過剰加工等）はムダです。アはムラ，イとエはムリの例です。"},

{q:"ニッチ戦略の事例として，最も適切なものはどれか。",
c:["アパレルメーカーA社は，生産コストを下げるために，生産拠点を海外に移した。また，大量に販売が見込めるカジュアルウェアを中心に，安価な商品を全国で販売することにした。","業界2位の食品メーカーB社は，トップシェアを獲得するために，業界3位のC社と経営統合することにした。","金属加工メーカーD社は，自社固有の加工技術を生かして，密閉度の極めて高い高価な無水調理鍋を高級レストラン向けに販売することにした。","電機メーカーE社は，販売量が減ってきた中型テレビ事業を売却し，完全撤退することにした。"],a:2,
e:"特定の狭い市場（ニッチ）で独自技術を生かして展開するのがニッチ戦略の典型です。"},

{q:"購買，製造，販売という供給者から消費者までを結ぶ一連の業務のつながりを総合的に管理し，資材の調達から顧客への販売に至る在庫などの無駄をなくして，プロセス全体の最適化を図るものはどれか。",
c:["CRM","POS","SCM","SFA"],a:2,
e:"供給者から消費者までの一連の業務を管理し最適化するのはSCM（サプライチェーンマネジメント）です。"},

{q:"IT基本計画の策定の際，明確にすべき事項だけを全て挙げたものはどれか。\n\na　ITシステムの利活用に関わるステークホルダ\nb　組織体の現在及び将来的なニーズへの対応\nc　発生したインシデントに関する管理手順\nd　利用者及び関係者との合意に基づいた業務要件とその優先順位",
c:["a, b","a, b, c","a, b, d","b, c, d"],a:2,
e:"IT基本計画にはステークホルダ・ニーズ対応・業務要件と優先順位(a,b,d)が含まれます。個別インシデント管理手順(c)は運用フェーズの内容です。"},

{q:"情報システムの企画，開発，運用，保守に関わるマネジメントとプロセスに対して，ITガバナンスにおける経営陣の活動として，評価，指示，モニターを実施する必要がある。ITガバナンスにおける経営陣の活動に関する記述として，適切なものだけを全て挙げたものはどれか。\n\na　外部のコンサルタントに責任と権限を委譲し，戦略立案からモニタリングまで全面的に任せる。\nb　情報システム戦略で想定した効果が，どの程度達成されているか確認するための情報を収集する。\nc　情報システム戦略を実現するために，必要な責任と要員を組織に割り当てる。\nd　情報システムの複数の将来像を想定し，外部の情報システムの専門家に比較分析を依頼して評価する。",
c:["a, b, c","a, c","b, c","b, c, d"],a:3,
e:"経営陣は最終責任を持ちつつ効果確認(b)・責任と要員の割当(c)・専門家への評価依頼(d)を行うのが適切です。aのように全面委任するのは経営陣の責務放棄となり不適切です。"},

{q:"クライアントPCへのソフトウェアの導入作業が契約に含まれるシステム開発プロジェクトがある。導入作業の行動に関する記述のうち，適切なものだけを全て挙げたものはどれか。\n\na　導入作業中に契約外のPCが見つかった。そのPCを導入対象外とした。\nb　導入作業中に契約外のPCへの導入を依頼された。依頼に基づいて，その対応を無償で行った。\nc　導入作業の続行が困難な状態となった。発注者と合意し，導入前の状態に復旧した。",
c:["a","a, b","a, c","b, c"],a:2,
e:"契約範囲外のPCは対象外とする(a)，続行困難時は発注者と合意し復旧する(c)のが適切です。契約外作業を無償で行う(b)ことは契約範囲逸脱であり不適切です。"},

{q:"Aさんは新規プロジェクトの計画段階の作業をしており，開発コストの見積りに着手した。この段階で短期的に概算費用を見積もる方法として，最も適切なものはどれか。",
c:["FP法を用いて見積もる。","作業単位のコストを見積もり，合算して全体を見積もる。","予想されるソフトウェアのコード行数を基に見積もる。","類似プロジェクトを参考に見積もる。"],a:3,
e:"計画初期段階で短時間に概算費用を見積もるには類推見積り（類似プロジェクト参考）が適しています。"},

{q:"要求事項が明確であり仕様変更が少ないことが見込まれるソフトウェアの開発に用いる開発モデル・手法として，最も適切なものはどれか。",
c:["アジャイル開発","ウォーターフォールモデル","スパイラルモデル","プロトタイピングモデル"],a:1,
e:"要求が明確で変更が少ない場合は工程を順に進めるウォーターフォールモデルが適します。"},

{q:"システム開発のプロジェクトマネジメントにおけるWBSの説明として，最も適切なものはどれか。",
c:["クリティカルパス上の作業を記載したものである。","主要な成果物に関する予定開始日と予定終了日を記載したものである。","全ての成果物を作成するための作業を階層的に分解して記載したものである。","プロジェクトで使用するツールを記載したものである。"],a:2,
e:"WBS（作業分解構成図）は全成果物の作業を階層的に分解したものです。"},

{q:"企業の活動に関する記述のうち，内部統制の活動内容として，最も適切なものはどれか。",
c:["決算発表の内容に重大な誤りがあった場合は，速やかに外部に公表する。","支払伝票を起票した際は，起票者が責任をもって確認し最終承認を行う。","定期的にリスクを評価し，洗い出されたリスクの全てを“回避”で対応する。","内部通報は必ず直属の上司を通じて行うことを，ルールとして徹底する。"],a:1,
e:"支払伝票の起票内容を確認し最終承認する仕組みは内部統制（職務分掌・相互牽制）の活動です。ウはリスク対応の一律回避が不適切，エは直属上司限定が内部通報制度の趣旨に反します。"},

{q:"ITガバナンスの活動において，取締役会等のリーダーシップに関するリスクの記述として，最も適切なものはどれか。",
c:["権限委譲して策定させた成果物であるIT戦略は，担当部門に最終的な責任をもたせないと，取締役会等の説明責任が果たせない。","組織体としてのパフォーマンスの期待値は，取締役会等が設定に関与すると，現状踏襲型となり組織体の目的を達成できない。","取締役会等が規範を策定し，率先して遵守しないと，組織体にその倫理的な行動が徹底されない。","取締役会等が組織体のITガバナンス方針を明示すると，情報システム部門主導の活動に偏重してしまう。"],a:2,
e:"取締役会等が自ら規範を率先して遵守しないと，組織全体への倫理的行動の徹底が図れないというリスクがあります。"},

{q:"サービスデスクに関する記述として，最も適切なものはどれか。",
c:["受入テストの段階で，利用者からの不具合の報告を受け付ける窓口","システム稼働後の段階で，利用者からの問合せを受け付ける窓口","プログラム開発の段階で，利用者からの質問を受け付ける窓口","要件定義の段階で，利用者からの要求を受け付ける窓口"],a:1,
e:"サービスデスクはシステム稼働後の運用段階で利用者問合せを受け付ける窓口です。"},

{q:"ある企業でスマートフォン向けのアプリケーションソフトウェアの開発を計画しており，2週間ごとに新機能や不具合の修正を含めた新しいバージョンを繰り返しリリースすることにした。新機能の候補や不具合は一覧表で管理し，優先順位をつけて開発し，逐次リリースする方針にした。この開発に採用するソフトウェア開発モデルとして，最も適切なものはどれか。",
c:["DevOps","アジャイル","ウォーターフォール","リバースエンジニアリング"],a:1,
e:"短いサイクルで優先順位をつけて反復開発・リリースを行う方式はアジャイルです。"},

{q:"あるサービスデスクでは，電子メールによる問合せに対応しており，受付担当者がメールの内容を確認し，回答担当者の割当てをしていた。このたび，割当て業務の効率化を目的に，自動割当てツールを導入した。自動割当てツールは，メールの内容を基に自動で回答担当者の割当てを行うが，割当てができないことや割当てミスをすることがあり，それらについては，人手で対応している。導入前及び導入半年後の状況が次のとき，割当ての時間はサービスデスク全体で何%削減できたか。ここで，割当ての時間の削減率（%）は小数第1位を四捨五入するものとする。\n\n導入前：問合せ件数1,000件/日，割当ての時間2分/件\n導入半年後：問合せ件数1,000件/日\n　自動割当てができた割合90%（割当ての時間0分/件）うち割当てミスの割合5%（割当ての時間4分/件）\n　自動割当てができなかった割合10%（割当ての時間2分/件）",
c:["80","81","85","86"],a:1,
e:"導入前＝1000件×2分＝2000分。導入後：自動成功分900件のうち5%(45件)がミスで4分/件＝180分，残り855件は0分。自動不可100件×2分＝200分。合計＝380分。削減率＝(2000-380)/2000＝81%。"},

{q:"プロジェクトにおいて，新規プロジェクトを正式に認可する文書として，適切なものはどれか。",
c:["ステークホルダ登録簿","プロジェクト憲章","プロジェクトスコープ記述書","リスク登録簿"],a:1,
e:"プロジェクトを正式に認可する文書はプロジェクト憲章です。"},

{q:"ITサービスマネジメントのプロセスである問題管理の説明として，適切なものはどれか。",
c:["ITサービスを提供するためのハードウェア，ソフトウェア，ドキュメントなどの構成情報を維持管理する。","計画外のITサービスの中断に対して，迅速にサービスを復旧する。","障害の根本原因を調査し，問題の解決策を提示する。","プログラム修正を実施するための計画を立て，確実に修正されるように管理する。"],a:2,
e:"問題管理は障害の根本原因を調査し解決策を提示するプロセスです。アは構成管理，イはインシデント管理，エは変更管理の説明です。"},

{q:"監査を会計監査，業務監査，情報セキュリティ監査，システム監査に分けたとき，システム監査に関する記述として，最も適切なものはどれか。",
c:["業務で使用している情報の漏えいに関するリスクマネジメントが効果的に実施されていることの検証","財務諸表の作成に至る業務全般に関して，不正や誤りがなく処理されていることの検証","情報システムに係るリスクに対して，組織において適切に対応していることの検証","情報システムの利用を含めた組織内の諸業務が組織の方針に従って，合理的かつ効率的に運用されていることの検証"],a:2,
e:"システム監査は情報システムに係るリスクへの適切な対応を検証します。アは情報セキュリティ監査，イは会計監査，エは業務監査の説明です。"},

{q:"ある組織では，IT資産を管理しているグループが，共有ディスクの使用量を月次でチェックし，容量が不足しそうなときは，不要なファイルを消すよう呼び掛けたり，すぐに使わないファイルを別のメディアに退避したりして，容量が不足することを回避する対応を行っている。共有ディスクの増設の対応は，年単位で計画して実施している。ある日，共有ディスクの使用量が上限に達し，組織の業務に支障が出る事象が発生した。この事象への対応を，インシデント管理，問題管理，サービスマネジメントシステムの改善に分けて考えるとき，サービスマネジメントシステムの改善として，適切なものだけを全て挙げたものはどれか。\n\na　共有ディスクの使用量が大きいファイルを調べ，当面の業務に使用しないものを一時的に別のストレージに移動する。\nb　共有ディスクの使用量が上限に達した原因を特定し，再発防止策を検討する。\nc　共有ディスクの使用量をタイムリーに把握し，容量不足の兆候を早期に検知できるようにする。\nd　すぐに共有ディスクの増設の手続を進める。",
c:["a, d","b, d","c","c, d"],a:2,
e:"aは応急対応（インシデント管理），bは原因特定・再発防止（問題管理），dは増設手続（インシデント対応）です。cの監視体制の改善がサービスマネジメントシステムの改善に当たります。"},

{q:"システム開発プロジェクトで開催するプロジェクト会議に関する記述のうち，最も適切なものはどれか。",
c:["会議で決まった内容を周知徹底するために，議事録を作成して必要な関係者と共有する。","議論が中途半端にならないように，会議の終了時刻は決めずに実施する。","効率よくシステム開発プロジェクトを遂行するために，全ての会議にステークホルダ全員が常に参加する。","様々な内容を会議で議論できるように，会議の開始直後に会議の議題を参加メンバーから募って確定する。"],a:0,
e:"決定事項を関係者と共有するために議事録を作成するのは適切なプロジェクト会議運営です。"},

{q:"次の表の作業を3名で実施するとき，全ての作業を終わらせるのに必要な最短の日数は何日か。ここで，複数要員が必要な作業は全員がそろわないと着手できず，指定された要員数以上の要員を充てても所要日数は短縮できない。また，着手した作業は作業が完了するまで中断できないものとする。\n\n作業　前提作業　要員数　所要日数\nA　　－　　　　1名　　3日\nB　　A　　　　2名　　3日\nC　　A　　　　2名　　3日\nD　　B　　　　1名　　3日\nE　　C　　　　2名　　3日\nF　　D, E　　1名　　3日",
c:["9日","12日","15日","18日"],a:2,
e:"3人しかいないため，前提Aの後にB(2名)とC(2名)を同時実施できず順に実施する必要があります。A(3日)→B(3日)→C(3日)→D(B後,3日,Cと並行可)→E(C後,3日)→F(D,E完了後,3日)。合計15日が最短になります。"},

{q:"システム監査において，各部署の外部媒体の管理状況について調査することにした。システム監査を，監査計画，予備調査，本調査，評価・結論のプロセスに分けて実施するとき，収集した結果に基づき，外部媒体の管理状況についての監査意見を検討するプロセスはどれか。",
c:["監査計画","予備調査","本調査","評価・結論"],a:3,
e:"収集結果に基づき監査意見を検討するのは評価・結論のプロセスです。"},

{q:"業務システムの開発において，開発者がシステム要件定義を実施する場合，利用者の関わり方として，最も適切なものはどれか。",
c:["開発者が行うシステム要件のレビューに参加し，妥当性を確認する。","開発者に全て任せ，その決定に従う。","システムの保守が可能かどうかを見極める。","システム要件の技術的な実現性を検証する。"],a:0,
e:"利用者はシステム要件のレビューに参加し妥当性を確認する役割を担うべきです。"},

{q:"SLAの計画立案，サービス内容の交渉，草案作成，合意，導入，測定などの活動を行うものはどれか。",
c:["アウトソーシング","サービスレベル管理","サービスレベル契約","リエンジニアリング"],a:1,
e:"SLAに関する一連の活動（計画・交渉・合意・測定等）を行うプロセスはサービスレベル管理です。"},

{q:"ある組織では過去には全員出社して業務を遂行していたが，現在は出社とテレワークの両方を使い分けて業務を遂行している。この組織において，ファシリティマネジメントの観点で改善を図っている事例として，適切なものだけを全て挙げたものはどれか。\n\na　従業員のPCにインストールされたWeb会議用のソフトウェアを常に最新にし，Web会議における利便性及びセキュリティを向上させる。\nb　執務室のレイアウト変更や大画面のTV会議室の設置を行い，従業員間のコミュニケーションを取りやすくする。\nc　出社率を踏まえてフリーアドレスエリアの割合を増加させ，オフィスを縮小させる。\nd　短時間勤務や自宅外での業務を可能とする制度を導入し，様々な従業員が業務に参画しやすくする。",
c:["a, d","b","b, c","b, d"],a:2,
e:"ファシリティ（施設・設備）に関する改善はレイアウト変更・TV会議室設置(b)とオフィス縮小(c)です。aはIT・ソフトウェア管理，dは人事制度であり施設管理の観点ではありません。"},

{q:"IoTのセキュリティに関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\nネットワークカメラの画像を盗み見される脅威のうち，ネットワークカメラへの［a］対策として，第三者がカメラにアクセスして映像を閲覧できないようにするためには，［b］で利用しない。",
c:["DDoS攻撃 / 初期パスワード","DDoS攻撃 / 有線回線","不正侵入 / 初期パスワード","不正侵入 / 有線回線"],a:2,
e:"画像を盗み見される脅威は不正侵入であり，初期パスワードのまま利用しないことが対策になります。"},

{q:"DBMSにおけるチェックポイントの説明として，適切なものはどれか。",
c:["トランザクションが正常に処理されたときに，トランザクションの一連の処理を確定させること","トランザクションが何らかの理由で正常に処理されなかったときに，データベースをトランザクションの処理開始前の状態に戻すこと","複数のトランザクションを並列に処理しているときに，ロックの影響によってトランザクション同士が互いに相手のロックの解放を待つ状態になること","複数のトランザクションによるメモリ上のデータ更新の結果を，一度にまとめてHDDなどの外部記憶装置に書き込む操作や，操作が行われた時点のこと"],a:3,
e:"チェックポイントはメモリ上の更新結果を一括して外部記憶装置に書き込む操作・時点を指します。アはコミット，イはロールバック，ウはデッドロックの説明です。"},

{q:"関係データベースで管理している“学生”表，“科目”表，“成績”表がある。1人の学生は複数の科目を履修するものとし，“学生”表に登録されていない学生や，“科目”表に登録されていない科目は“成績”表に登録できないものとするとき，外部キーとして設定するのが適切なものはどれか。ここで，表中の下線は主キーを表す。\n\n学生（学生番号，学生名）　科目（科目コード，科目名）　成績（学生番号，科目コード，成績）",
c:["“学生”表の学生番号，“成績”表の学生番号","“学生”表の学生名，“科目”表の科目名","“成績”表の学生番号と科目コード","“成績”表の成績"],a:2,
e:"“成績”表の学生番号・科目コードがそれぞれ“学生”表・“科目”表の主キーを参照する外部キーです。"},

{q:"UXデザインで用いられることがある構造化シナリオ法における，三つのシナリオはどれか。",
c:["アクティビティ，インタラクション，バリュー","アクティビティ，インタラクション，ペルソナ","アクティビティ，バリュー，ペルソナ","インタラクション，バリュー，ペルソナ"],a:0,
e:"構造化シナリオ法の三つのシナリオはバリューシナリオ・アクティビティシナリオ・インタラクションシナリオです。"},

{q:"無線LANで使用するWPA2の機能として，適切なものはどれか。",
c:["2本のアンテナを用いることによってデータの送受信を高速化する。","アクセスポイントをステルス化する。","通信データを暗号化する。","登録されたMACアドレスをもつ機器以外からのアクセスを拒否する。"],a:2,
e:"WPA2は無線LANの通信データを暗号化するセキュリティ規格です。"},

{q:"レスポンシブWebデザインに関する記述として，適切なものはどれか。",
c:["PC，スマートフォンなど，多くの種類の端末で，見やすく，かつ操作しやすくなるように，表示する端末の画面サイズなどに応じてWebサイトの画面レイアウトが変化する。","Webブラウザで動画コンテンツをストリーミング再生するとき，サーバやネットワークの負荷が軽減されるように，複数のコンテンツ配信サーバのうち，利用者に適したサーバに接続させてデータを取得する。","スマートフォンなどの端末向けのWebアプリケーションにおいて，歩数や移動速度などを計測できるように，端末に内蔵された加速度センサーやジャイロセンサーのデータを使用する。","操作説明書を読まなくてもWebサイトの使用方法を理解できるように，Webブラウザの利用者がマウスポインタをWebコンテンツに重ねたとき，ポップアップを用いて機能の説明，対象の状態などを表示する。"],a:0,
e:"レスポンシブWebデザインは画面サイズに応じてレイアウトが変化する仕組みです。"},

{q:"PCの画面表示に必要なデータを保持するのに使われる，画面表示専用メモリはどれか。",
c:["EEPROM","VRAM","キャッシュメモリ","フラッシュメモリ"],a:1,
e:"画面表示専用のメモリはVRAM（Video RAM）です。"},

{q:"システムの性能評価におけるベンチマークテストに関する記述として，適切なものはどれか。",
c:["評価対象のシステムで使われるものと同じデータ，同じプログラムを，ほかの疑似システム上で実行させて性能を評価する。","評価対象のシステムの動作特性を，取扱いの容易な形にモデル化したものを用いて，ほかの疑似システム上で実行させて性能を評価する。","評価対象のシステムのプログラムステップ数，ハードウェア性能，I/O回数の机上計算値などを基に処理時間を積算して性能を評価する。","標準的な処理を設定し，それを実行する評価用プログラムを，評価対象のシステム上で実際に実行させて性能を評価する。"],a:3,
e:"ベンチマークテストは実際のシステム上で標準的な評価用プログラムを実行し性能を測定する手法です。"},

{q:"PCに保存されたファイルを使用できなくするランサムウェアによる被害を低減させるための対策として，適切なものはどれか。",
c:["UPSの導入","データの暗号化","データのバックアップ","ログインパスワードの変更"],a:2,
e:"ランサムウェア被害からの復旧に有効な対策はデータのバックアップです。"},

{q:"キャリアアグリゲーションの説明として，適切なものはどれか。",
c:["移動中に携帯電話が接続する基地局を切り替える技術","携帯電話の通信のセキュリティ機能を高める技術","複数の異なる周波数の電波を束ねることによって，無線通信を高速化する技術","無線LANにおいて，アクセスポイントと呼ばれる基地局を経由して端末同士が通信を行う技術"],a:2,
e:"複数の周波数帯の電波を束ねて高速化する技術がキャリアアグリゲーションです。"},

{q:"DNSサーバの役割に関する記述として，適切なものはどれか。",
c:["LAN上のPCからインターネット上のWebサーバへのリクエストを中継するものであり，PCの代理としてインターネット上のWebサーバへアクセスして，その応答をPCに返す。","PCからサーバへのファイルの送受信の要求を受け付け，ファイルを転送する。","PCに対してIPアドレスを自動で割り当て，サブネットマスクとデフォルトゲートウェイのIPアドレスの通知を行う。","ドメイン名をIPアドレスに変換する，又はIPアドレスをドメイン名に変換する。"],a:3,
e:"DNSサーバはドメイン名とIPアドレスを相互に変換する役割を担います。アはプロキシサーバ，イはFTPサーバ，ウはDHCPサーバの説明です。"},

{q:"アプリケーションソフトウェアの操作を行うとき，質問に答えていく対話形式によって，煩雑な操作を簡単に行えるようにする機能はどれか。",
c:["アーカイブ","ウィザード","オートコンプリート","ポップアップウィンドウ"],a:1,
e:"対話形式で質問に答えて操作を進める機能はウィザードです。"},

{q:"手続sortは，要素数が2以上の整数型の配列を引数numberArrayで受け取り，その要素を昇順に並べ替えた結果を出力する。手続sortの動作確認のために，処理の途中でjの値とworkArrayの全ての要素を出力する。配列numberArrayを{3,5,1,2,4}とし，手続sortをsort(numberArray)として呼び出したとき，jの値が3と出力された直後のworkArrayの全ての要素の出力はどれか。ここで，配列の要素番号は1から始まる。",
c:["1, 2, 3, 4, 5","1, 2, 3, 5, 4","4, 5, 3, 2, 1","5, 4, 3, 2, 1"],a:1,
e:"選択ソートで j=1: 最小値1(idx3)とworkArray[1]を交換→{1,5,3,2,4}。j=2: idx2以降の最小値2(idx4)と交換→{1,2,3,5,4}。j=3: idx3以降の最小値は3自身のため変化なし→{1,2,3,5,4}。"},

{q:"メールソフトが電子メールの送受信に用いるプロトコルの組合せとして，適切なものはどれか。",
c:["送信IMAP4 / 受信POP3","送信IMAP4 / 受信SMTP","送信POP3 / 受信SMTP","送信SMTP / 受信IMAP4"],a:3,
e:"メール送信にはSMTP，受信にはPOP3またはIMAP4を用います。"},

{q:"関係データベースにおけるデータの正規化に関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\n正規化の主な目的として，データの重複を排除し，［a］ことが挙げられる。正規化には複数の段階があり，これを進めていくと，［b］。",
c:["圧縮率を向上させる / 一つの表が複数の表に分割される","圧縮率を向上させる / 複数の表が一つの表に統合される","一貫性を保つ / 一つの表が複数の表に分割される","一貫性を保つ / 複数の表が一つの表に統合される"],a:2,
e:"正規化の目的はデータの重複排除と一貫性の確保です。段階を進めると表は複数に分割されていきます。"},

{q:"ISMSにおける情報セキュリティインシデントの管理に関する記述のうち，適切なものはどれか。",
c:["情報セキュリティインシデントには臨機応変な対応が求められるので，あらかじめ対応手順を文書化しておくのではなく，実際の対応内容を記録する。","情報セキュリティインシデントから得られた知識は，模倣を防ぐために情報セキュリティの管理策の強化には用いない。","情報セキュリティ事象は，その評価を待つことなく，報告された時点で情報セキュリティインシデントに分類される。","情報セキュリティ事象は，適切な管理者へ速やかに報告するために，あらかじめその連絡経路と仕組みを用意しておく。"],a:3,
e:"情報セキュリティ事象は速やかに報告できるよう，あらかじめ連絡経路・仕組みを整備しておくことが適切です。"},

{q:"インターネットバンキングなどのWebサイトで利用されているリスクベース認証の例として，適切なものはどれか。",
c:["利用者がいつもログインに使っているPCとは異なるPCからのログインであったので，本人しか知らない秘密の質問による追加の認証を行った。","利用者がログインした後，画面操作が一定時間なかったので，自動的にログアウトして，再度ログインを求めた。","利用者がログインするときにパスワードを連続して複数回間違って入力したので，アカウントをロックした。","利用者がログインに使っているパスワードが長期間変更されていなかったので，パスワードの変更を促した。"],a:0,
e:"通常と異なる状況（普段と違う端末からのログイン等）を検知して追加認証を課すのがリスクベース認証です。"},

{q:"関係データベースで管理している“口座”表，“顧客”表及び“取引明細”表がある。新たな顧客が口座の開設と同時に1万円を入金するとき，表にデータを追加する順序として，適切なものはどれか。ここで，下線のうち実線は主キーを，破線は外部キーを表す。\n\n口座（口座番号，口座種別，残高，顧客番号）　顧客（顧客番号，顧客名）　取引明細（取引番号，取引日時，取引種別，取引金額，口座番号）",
c:["口座 → 顧客 → 取引明細","顧客 → 口座 → 取引明細","顧客 → 取引明細 → 口座","取引明細 → 口座 → 顧客"],a:1,
e:"外部キーが参照する側の表（顧客）を先に登録し，次に口座，最後にその口座番号を参照する取引明細を登録する必要があります。"},

{q:"OSS（Open Source Software）のライセンスにおけるコピーレフトに関する記述として，適切なものはどれか。",
c:["OSSの作成者が，ソフトウェアの著作権を放棄している。","OSSの著作権者は，利用者がソフトウェアを利用することに対して金銭的な対価を要求しなければならない。","OSSの利用者が改変して作成した派生ソフトウェアは，改変部分のソースコードを非公開としたまま，配布することができる。","OSSの利用者が改変して作成した派生ソフトウェアを配布する場合には，元のOSSのライセンスと同じライセンスを適用しなければならない。"],a:3,
e:"コピーレフトは派生ソフトウェアを配布する際に元と同じライセンスの適用を義務付ける考え方です。"},

{q:"表計算ソフトを用いて，二つの2進数α，βの和を求める。α，βの桁数は2桁に限定し，2の位，1の位の順に各桁の値がセルB3，セルC3とセルB4，セルC4に入力されている。ワークシートは2進数α=10，β=11の例である。結果は，4の位，2の位，1の位の順にセルA5，セルB5，セルC5に表示したい。セルB2は1の位からの繰り上がりの情報を格納するために用いられ，式IF(C3+C4=2,1,0)が入力されている。セルB5に入力する式はどれか。",
c:["IF(合計(B2:B4)＜2, 合計(B2:B4), IF(合計(B2:B4)＝2, 0, 1))","IF(合計(B2:B4)＜2, 合計(B2:B4), IF(合計(B2:B4)＝2, 1, 0))","IF(合計(B2:B4)＞2, 合計(B2:B4), IF(合計(B2:B4)＝2, 0, 1))","IF(合計(B2:B4)＞2, 合計(B2:B4), IF(合計(B2:B4)＝2, 1, 0))"],a:0,
e:"合計が2未満なら合計そのものが桁の値，2以上なら2進数のため2で0，3で1となる式が正しく，選択肢アが対応します。"},

{q:"電子メールの宛先入力におけるBcc欄に関する記述のうち，適切なものはどれか。",
c:["Bcc欄に入力したメールアドレスには，To欄やCc欄に入力したメールアドレスは通知されない。","Bcc欄に入力したメールアドレスには，自動的に暗号化された電子メールが送信される。","Bcc欄に入力したメールアドレスには，添付ファイルが削除された電子メールが送信される。","To欄やCc欄に入力したメールアドレスには，Bcc欄に入力したメールアドレスは通知されない。"],a:3,
e:"To欄・Cc欄の受信者にはBcc欄に入力されたアドレスは通知されません（見えません）。"},

{q:"IoTデバイスで用いられるLPWAに関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\nLPWAに分類される無線通信方式の特徴は，通信可能な範囲が無線LANに比べて［a］，消費する電力が第4世代移動通信規格（4G）に比べて［b］。",
c:["狭く / 多い","狭く / 少ない","広く / 多い","広く / 少ない"],a:3,
e:"LPWAは通信範囲が広く，消費電力は少ないという特徴を持ちます。"},

{q:"ある企業では，サーバ室への入室管理を暗証番号で行っていたが，虹彩認証装置による本人確認を加えることによって，無許可の者の入室をより確実に防止する対策とした。これは，サーバ室における情報セキュリティ要素のうち，どれを高める対策に該当するか。",
c:["可用性","完全性","機密性","否認防止"],a:2,
e:"無許可者のアクセスを防ぐ対策は情報の機密性を高めるものです。"},

{q:"IoTデバイスとIoTサーバで構成され，IoTデバイスが計測した外気温をIoTサーバへ送り，IoTサーバからの指示でIoTデバイスが窓を開閉するシステムがある。このシステムのIoTデバイスに搭載された，外気温を電気信号に変換する役割をもつものはどれか。",
c:["アクチュエーター","エッジコンピューティング","キャリアアグリゲーション","センサー"],a:3,
e:"外気温などの物理量を電気信号に変換するのはセンサーの役割です。窓の開閉のような物理的な動作を行うのはアクチュエーターです。"},

{q:"企業のリスクマネジメントの一環として行われるサイバーセキュリティリスク対策の推進において，経営者に求められる役割として，最も適切なものはどれか。",
c:["IT部門のセキュリティ担当者に，部門ごとのサイバーセキュリティリスク対応方針の策定と実行を全て任せる。","サイバーセキュリティ対策を実施する上での責任者となるCISOを任命し，実行や判断を全て任せる。","実施方針の検討，予算や人材の割当て，実施状況の確認や問題の把握と対応を通じて自らリーダーシップを発揮する。","専門家である外部の経営コンサルタントに，自社の組織や事業におけるリスクの分析と対策の推進に関する権限と責任を委譲する。"],a:2,
e:"経営者は方針検討・予算人材配分・実施状況確認等を通じ自らリーダーシップを発揮すべきです。"},

{q:"バイオメトリクス認証に関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\nバイオメトリクス認証を利用したシステムの設計を始めるときには，システムの目的と認証の用途を明らかにし，認証精度の設定方針を策定することが必要である。他人受入率が［a］なるように設定した場合は，安全性を重視した認証になり，本人拒否率が［b］なるように設定した場合は，本人の利便性を重視した認証になるといえる。",
c:["高く / 高く","高く / 低く","低く / 高く","低く / 低く"],a:3,
e:"他人受入率を低くすると安全性重視，本人拒否率を低くすると利便性重視の認証になります。"},

{q:"Bluetoothの規格に含まれ，デバイス間の省電力通信を実現させるものはどれか。",
c:["BLE","LPWA","LTE","PLC"],a:0,
e:"Bluetoothの省電力通信規格はBLE（Bluetooth Low Energy）です。"},

{q:"ニューラルネットワークの学習に用いられるバックプロパゲーションで行われていることはどれか。",
c:["各ノードの重みを調整して，誤差を小さくする。","各ノードの重みを調整して，最適な活性化関数を選択する。","ノードの数を変更して，誤差を小さくする。","ノードの数を変更して，処理速度を高める。"],a:0,
e:"バックプロパゲーションは出力誤差を基に各ノードの重みを調整する手法です。"},

{q:"職場のPCに適用する情報セキュリティ対策a〜cのうち，マルウェア対策ソフトの導入のほかに，マルウェア感染を防止するための対策として，適切なものだけを全て挙げたものはどれか。\n\na　OSのセキュリティパッチ（修正モジュール）の適用\nb　起動ドライブとなっているハードディスクに対するパスワード設定\nc　複雑かつ十分な長さをもつログインパスワードの導入",
c:["a","a, b","b","c"],a:0,
e:"OSの脆弱性対策としてセキュリティパッチの適用はマルウェア感染防止に直接有効です。bとcは不正アクセス・盗難対策であり，マルウェア感染防止策としては直接的ではありません。"},

{q:"ある推論システムは，演繹推論，帰納推論，仮説形成などの推論が実行できる。この推論システムへの入力と得られた出力に関する記述のうち，演繹推論を実行した例として，適切なものはどれか。",
c:["“HDDとSSDは記憶装置である”と入力した後に，“HDDの台数を増やすと記憶容量が増える”と入力した。出力は，“SSDの台数を増やすと記憶容量が増える”となった。","“HDDは台数を増やすと記憶容量が増える”と入力した後に，“記憶装置は台数を増やすと記憶容量が増える”と入力した。出力は，“HDDは記憶装置である”となった。","“記憶装置であるHDDは記憶容量をもつ”と入力し，同時に“記憶装置であるSSDは記憶容量をもつ”と入力した。出力は，“全ての記憶装置は記憶容量をもつ”となった。","“全ての記憶装置は記憶容量をもつ”と入力した後に，“HDDは記憶装置である”と入力した。出力は，“HDDは記憶容量をもつ”となった。"],a:3,
e:"一般法則（全ての記憶装置は記憶容量をもつ）から個別事実（HDDは記憶装置）を経て結論（HDDは記憶容量をもつ）を導く演繹推論の例です。アは類推，イ・ウは帰納推論の例です。"},

{q:"関数isPrimeは，引数として与えられた正の整数が，素数であればtrueを，素数でなければfalseを戻り値とする。例えば，関数isPrimeをisPrime(2)として呼び出したときの戻り値はtrueである。プログラム中のa，bに入れる字句の適切な組合せはどれか。\n\n〔プログラム〕\n論理型: isPrime(整数型: num)\n整数型: div ← 2\nif (num が 2 [a])\n　return false\nelse\n　while (num が div [b])\n　　if (num ÷ div の余り が 0 と等しい)\n　　　return false\n　　else\n　　　div ← div + 1\n　　endif\n　endwhile\n　return true\nendif",
c:["以下 / と等しい","以下 / より大きい","より小さい / と等しい","より小さい / より大きい"],a:3,
e:"isPrime(2)はtrueを返す必要があるため，aは「より小さい」（num<2のときfalse）でなければなりません。ループは割り切れるdivを探すためnum>divの間繰り返す必要があるため，bは「より大きい」です。"},

{q:"データベースの障害に備えて，毎日業務終了後にバックアップファイルを取得している。毎週土曜日にはフルバックアップファイルを取得し，日曜日から金曜日は差分バックアップファイルを取得する。差分バックアップファイルとは，最後のフルバックアップファイルから，差分バックアップファイルを取得する当日までの，全ての差分データのバックアップファイルである。水曜日にデータベースが破損したので，前日の火曜日の業務終了時点のデータベースに復旧することにした。このとき，データベースを復旧させるために最低限必要なバックアップファイルはどれか。",
c:["日曜日，月曜日及び火曜日の差分バックアップファイル","火曜日の差分バックアップファイル","土曜日のフルバックアップファイルと，日曜日，月曜日及び火曜日の差分バックアップファイル","土曜日のフルバックアップファイルと，火曜日の差分バックアップファイル"],a:3,
e:"差分バックアップは最後のフルバックアップからの全差分データを含むため，土曜のフルバックアップと火曜の差分バックアップのみで復旧可能です。"},

{q:"NASの説明として，適切なものはどれか。",
c:["PCやスマートフォンなどからネットワーク経由で利用できるように，ネットワークに直接接続して使用する外部記憶装置","記憶媒体上のデータの位置や書込み順序に関係なく，求めるデータに直接アクセスできるファイル形式","複数の記憶装置を1台の装置として管理し，データを分散して格納することによってアクセスの高速化や耐障害性の向上を図る技術","無線LANのネットワークを識別するために用いられる文字列"],a:0,
e:"NAS（Network Attached Storage）はネットワークに直接接続して使う外部記憶装置です。イは直接アクセス方式，ウはRAID，エはSSIDの説明です。"},

{q:"プログラミングすることによって，ペンの上げ下げ，直進及び右回りの方向転換が可能なロボットがある。このロボットに1辺が1mの正六角形を描画させるプログラムを作成した。次の正六角形描画プログラムのa，bに入れる字句の適切な組合せはどれか。\n\n〔正六角形描画プログラム〕\n(1) ペンを下ろす。\n(2) 処理回数のカウンタに［a］を設定する。\n(3) 次の処理を順に実行する。\n・1m直進する。\n・右回りに［b］度方向転換する。\n・処理回数のカウンタに1を加える。\n(4) 処理回数のカウンタが6未満の場合は，(3)に戻る。\n(5) ペンを上げる。",
c:["0 / 60","0 / 120","1 / 60","1 / 120"],a:0,
e:"6回繰り返すためカウンタの初期値は0にし，条件「6未満なら戻る」で6回実行させます。正六角形の外角は360÷6=60度です。"},

{q:"情報セキュリティに関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\n守るべき情報資産に対して望ましくない影響を及ぼす可能性のある原因のことを［a］といい，情報資産自身の価値を損なう可能性をもつ弱点のことを［b］という。",
c:["インシデント / リスク","脅威 / 脆弱性","脆弱性 / インシデント","リスク / 脅威"],a:1,
e:"望ましくない影響を及ぼす原因は脅威，資産の弱点は脆弱性です。"},

{q:"PKI（公開鍵基盤）の特徴として，適切なものはどれか。",
c:["共通鍵の所有者を確認する方法が提供されている。","知人が署名した鍵は信頼するという“信頼の輪”によって，公開鍵が正当であることを確認する。","電子証明書の正当性を認証局が保証する。","秘密鍵を安全に公開する方法が提供されている。"],a:2,
e:"PKIは認証局が電子証明書の正当性を保証する仕組みです。"},

{q:"デジタル署名やブロックチェーンで用いられるハッシュ関数には，SHA-256，SHA-512などがある。このようなハッシュ関数に関する記述として，適切なものはどれか。",
c:["あるハッシュ関数を用いて得たハッシュ値を，そのハッシュ関数に入力することによって，元のデータを復元することができる。","同じデータを異なるハッシュ関数にそれぞれ入力したとき，得られるハッシュ値は全て同じになる。","同じハッシュ関数を用いる場合，入力したデータが同じであれば，得られるハッシュ値は常に同じになる。","どのハッシュ関数にもそれぞれの逆関数が存在し，ハッシュ値から元のデータを復元することができる。"],a:2,
e:"ハッシュ関数は同じ入力に対して常に同じハッシュ値を出力しますが，一方向性のため元のデータへの復元はできません。"},

{q:"ゼロトラストセキュリティの考え方に基づいた情報セキュリティ対策の例として，適切なものはどれか。",
c:["インターネットと内部ネットワークの境界にファイアウォールを配置し，インターネットからの脅威を境界で遮断する。","内部ネットワークからであっても外部ネットワークからであっても，ネットワーク上の情報資源へのアクセスには二要素認証を利用する。","内部ネットワークに接続するPCにインストールされたソフトウェアに脆弱性が発見されたときに，そのセキュリティパッチは公開後直ちに適用する。","内部ネットワークに接続するPCのうち，インターネットにアクセスするPCだけにマルウェア対策ソフトをインストールする。"],a:1,
e:"ゼロトラストは内部・外部を問わずアクセスの都度検証を行う考え方であり，内外を問わず二要素認証を利用するのが典型例です。"},

{q:"次のISMSにおける実施項目のうち，最初に行うものはどれか。",

{q:"情報セキュリティ対策を，“技術的セキュリティ対策”，“人的セキュリティ対策”及び“物理的セキュリティ対策”に分類したとき，“物理的セキュリティ対策”の例として，適切なものはどれか。",
c:["機密情報の取扱いに関して，罰則を含めた規則を制定し，これを遵守させるために，関係者に定期的な教育を実施する。","被災によるシステム障害が発生してもサービスを継続できるように，遠隔地にバックアップシステムを用意する。","ますます方法が巧妙化されるサイバー攻撃による被害を防ぐために，サイバー攻撃の方法や対策に関する情報を従業員に周知する。","マルウェアによる被害を防ぐために，マルウェア対策ソフトを導入し，定義ファイルを常に最新に保つ。"],a:1,
e:"遠隔地にバックアップシステムを設置するのは物理的セキュリティ対策の例です。アとウは人的対策，エは技術的対策です。"},

{q:"SQLインジェクションの対策などで用いられ，処理の誤動作を招かないように，利用者がWebサイトに入力した内容に含まれる有害な文字列を無害な文字列に置き換えることを何と呼ぶか。",
c:["MACアドレスフィルタリング","サニタイジング","ストライピング","ソーシャルエンジニアリング"],a:1,

{q:"機密情報の取得などを目的として，特定の組織や個人に対して，複数の攻撃手法を使うなどして長期間にわたり継続的に攻撃を行うという特徴をもつ，サイバー攻撃はどれか。",
c:["APT攻撃","DDoS攻撃","ゼロデイ攻撃","パスワードリスト攻撃"],a:0,

{q:"OSS（Open Source Software）の取扱いに関する記述のうち，適切なものだけを全て挙げたものはどれか。\n\na　OSSを集めた記録媒体を，顧客に有償で提供する。\nb　改変したOSSを，特定の利用分野に制限してOSSとして提供する。\nc　不具合を発見して修正したOSSのソースコードを，自分のWebサイトで提供する。",
c:["a","a, c","b, c","c"],a:1,
e:"OSSは有償配布(a)やソースコード修正版の公開(c)は認められています。特定分野に利用制限を課す(b)ことはOSSライセンスの精神（自由な利用）に反する場合があり不適切です。"},

{q:"AIにおけるプロンプトエンジニアリングの説明として，適切なものはどれか。",
c:["AIが，多数の事象やデータから普遍的なルールや知識を獲得すること","AIに対する質問や指示などが入力できる状態であることを，画面上に記号や文字列で示すこと","意図した回答を得るためにAIに対する質問や指示の内容，情報の提供，出力形式の指定などを工夫すること","神経細胞が作るネットワークをコンピュータで模した，AIで用いられる計算モデルのこと"],a:2,
e:"プロンプトエンジニアリングは意図した回答を得るために質問・指示の内容や形式を工夫することです。"},

{q:"入力装置に関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\n［a］は，紙などに光を当て，反射光を読み取り，文字や図形をデジタルデータに変換してPCに取り込む。［a］が文字や図形をどの程度細かく読み取れるかの性能を示す単位として［b］が使われる。",
c:["イメージスキャナー / bps","イメージスキャナー / dpi","スクリーンリーダー / bps","スクリーンリーダー / dpi"],a:1,

{q:"特定電子メール法は，電子メールによる一方的な広告宣伝メールの送信を規制する法律である。企業担当者が行った次の電子メールの送信事例のうち，特定電子メール法の規制対象となり得るものはどれか。",

{q:"ハッカソンに関する記述として，最も適切なものはどれか。",

{q:"プロセスマイニングに関する記述として，最も適切なものはどれか。",

{q:"RPAに関する記述として，最も適切なものはどれか。",

{q:"4月1日から5月31日までに，取引①から取引⑤があった。各取引の受注，売上計上，現金回収の状況が表のとおりであるとき，この取引先に対する5月31日時点の売掛金は何万円か。ここで，4月1日時点で売掛金残高はないものとする。\n\n取引①：4/2受注，4/10売上計上800万円，4/30現金回収800万円\n取引②：4/5受注，4/15売上計上500万円，4/30現金回収500万円\n取引③：5/1受注，5/10売上計上1,300万円（6/30回収予定）\n取引④：5/6受注，5/15売上計上1,000万円（回収予定日未定）\n取引⑤：5/20受注400万円（売上未計上）",
c:["1,000","1,400","2,300","2,700"],a:2,
e:"取引①②は4月中に売上計上・現金回収が完了しているため売掛金はゼロ。取引③(1,300万円)と④(1,000万円)は売上計上済みで未回収のため売掛金に計上されます。取引⑤は受注のみで売上未計上のため対象外。合計1,300＋1,000＝2,300万円です。"},

{q:"業務と情報システムを最適にすることを目的として，業務と情報システムの現状の把握と目標とする理想像の設定から現状と理想との乖離を明確にし，目標に向けた改善活動を移行計画として定義したい。このときに用いられる手法として，最も適切なものはどれか。",
c:["BI (Business Intelligence)","EA (Enterprise Architecture)","MOT (Management of Technology)","SOA (Service Oriented Architecture)"],a:1,
e:"現状と理想像のギャップを明確にし，移行計画を定義する手法はEA（エンタープライズアーキテクチャ）です。"},

{q:"生成AIに関する記述として，最も適切なものはどれか。",
c:["一切の学習を必要とせずに，新しいコンテンツを生成する。","過去のデータから項目間の相関などを学習したモデルを用いて，現在のデータから将来の値を予測して出力する。","作成したシナリオに基づいて動作するソフトウェアロボットによって，業務を自動化する。","自然言語で指示された内容に従って，事前に学習したデータを基に，新しいコンテンツを生成する。"],a:3,
e:"生成AIは自然言語などの指示に従い，事前学習したデータを基に新しいコンテンツを生成します。"},

{q:"企業経営の中核となる考え方を，ミッション，ビジョン，バリューの三つに分けて示す場合，ビジョンとして示すものとして，最も適切なものはどれか。",
c:["企業の存在意義や使命","企業の存在意義や使命をふまえた，ある時点でのありたい姿","戦略を実現するために重要となる業績管理指標","戦略を実現するために重要となる成功要因"],a:1,
e:"ビジョンは存在意義・使命を踏まえた，ある時点でのありたい姿を示すものです。"},

{q:"著作権に関して，次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\n［a］は著作権法による保護の対象になるが，［b］は対象にならない。",
c:["アルゴリズム／操作マニュアル","アルゴリズム／通信プロトコル","ソースプログラム／操作マニュアル","ソースプログラム／通信プロトコル"],a:3,
e:"ソースプログラム自体は著作権法の保護対象ですが，アルゴリズムやプロトコルなどのアイデア・規約は保護対象になりません。"},

{q:"ERPシステムの説明として，適切なものはどれか。",
c:["企業内の個人がもつ営業に関する知識やノウハウを収集し，共有することによって，効率的，効果的な営業活動を支援するシステム","経理や人事，生産，販売などの基幹業務と関連する情報を一元管理し，経営資源を最適配分することによって，効率的な経営の実現を支援するシステム","原材料の調達から生産，販売に関する情報を，企業間で共有・管理することによって，ビジネスプロセスの全体最適を目指すシステム","個々の顧客に関する情報や対応履歴などを管理することによって，きめ細かい顧客対応を実施し，顧客満足度の向上を支援するシステム"],a:1,
e:"ERPは経理・人事・生産・販売など基幹業務の情報を一元管理し，経営資源を最適配分するシステムです。"},

{q:"公共交通機関での移動履歴，Webサイトでの商品検索履歴，SNSやブログで発信したデータなど，個人の活動を記録する技術，又は記録そのものを表す用語として，最も適切なものはどれか。",
c:["アクティビティ","トランザクション","ライフログ","レコードキーピング"],a:2,
e:"個人の活動履歴を記録する技術・記録そのものはライフログと呼ばれます。"},

{q:"自動運転の水準は，一般的に“レベル1”から“レベル5”に分けられている。“条件付運転自動化”と呼ばれる“レベル3”が示す自動運転の水準に関する記述として，最も適切なものはどれか。",
c:["運転の主体はシステムであり，人間が運転する必要はないが，システムによる自動運転の継続が難しい場合は，人間が運転しなければならない。","運転の主体はシステムであり，人間が運転する必要はないので，ハンドルやペダルなどの運転装置は不要だが，自動運転できる地域は限られる。","運転の主体は人間であり，高速道路で車線を維持しながら前の自動車に付いて走る機能のように，ハンドルと加減速の操作をシステムが支援する。","運転の主体は人間であり，自動ブレーキや急発進防止システムのように，前方又は後方の状況によって，システムが運転の一部を支援する。"],a:0,
e:"レベル3（条件付運転自動化）は運転の主体がシステムですが，自動運転の継続が難しい場合は人間が運転を引き継ぐ必要があります。"},

{q:"ある商品を5,000個販売したところ，売上げが6,000万円，利益が400万円となった。商品1個当たりの変動費が7,000円であるとき，利益を1,000万円以上にするためには，少なくともあと何個販売すればよいか。",
c:["500","1,200","6,200","7,500"],a:1,
e:"単価は6,000万円÷5,000個＝12,000円。固定費＝6,000万円－(7,000円×5,000個)－400万円＝2,100万円。利益1,000万円に必要な販売数N：12,000N－7,000N－2,100万＝1,000万 → 5,000N＝3,100万 → N＝6,200個。追加で必要な販売数は6,200－5,000＝1,200個です。"},

{q:"マーケティング戦略の策定プロセスのうち，自社製品の差別化ポイントを明確化するものはどれか。",
c:["セグメンテーション","ターゲティング","プロモーション","ポジショニング"],a:3,
e:"自社製品の差別化ポイントを明確化するプロセスはポジショニングです。"},

{q:"合意したサービス提供時間帯のうち，実際に顧客がITサービスを利用できた時間の割合で表されるものはどれか。",
c:["可用性","機能性","効率性","使用性"],a:0,
e:"サービス提供時間帯のうち実際に利用できた時間の割合は可用性で表されます。"},

{q:"ITサービスマネジメントに関して，次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\n［a］はサービス提供者と顧客との間で合意されたサービス品質に関する合意書である。［a］の遵守状況を確認し，ITサービスの品質を維持・改善させるための活動が［b］である。",
c:["NDA / SCM","NDA / SLM","SLA / SCM","SLA / SLM"],a:3,
e:"サービス品質の合意書はSLA，SLAの遵守状況を確認しサービス品質を維持・改善する活動はSLM（サービスレベル管理）です。"},

{q:"情報セキュリティ監査の説明として，最も適切なものはどれか。",
c:["一定の基準に基づいてITシステムの利活用に係る検証・評価を行い，ガバナンスの適切性などに対する保証や改善のための助言を行うもの","コンピュータの盗難や不正な持出しを物理的に防止し，情報セキュリティを確保するためのツール","組織体の価値及び組織体への信頼を向上させるために，組織体におけるITシステムの利活用のあるべき姿を示すIT戦略と方針の策定及びその実現のための活動","組織の情報資産に関わるリスクマネジメントが効果的に実施されているかどうかの検証又は評価"],a:3,
e:"情報セキュリティ監査は情報資産に関わるリスクマネジメントが効果的に実施されているかの検証・評価です。アはシステム監査，ウはITガバナンス活動の説明です。"},

{q:"ソフトウェア開発モデルであるアジャイルモデルの特徴に関して，次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\nアジャイルモデルとは，要件を確定してから開発を実施するウォーターフォールモデルの［a］する形で提唱された，［b］できるようにソフトウェアを開発するための手法の総称である。",
c:["課題を改善／開発工程で生じる種々の変更に迅速に対応","課題を改善／開発工程を順に実施","特徴を継承／開発工程で生じる種々の変更に迅速に対応","特徴を継承／開発工程を順に実施"],a:0,
e:"アジャイルモデルはウォーターフォールモデルの課題を改善する形で提唱され，開発工程で生じる種々の変更に迅速に対応できるようにする手法です。"},

{q:"変更管理委員会が設置されているプロジェクトで変更要求が発生した場合の記述として，最も適切なものはどれか。",
c:["変更管理委員会では，プロジェクトに関わるステークホルダ以外の第三者によって変更要求が審議される。","変更管理委員会は，コストの増加や期日の延期を理由に変更要求を却下してよい。","変更管理委員会は，スコープに変更が発生しない範囲で変更要求を受け付けなければならない。","変更要求は，全てプロジェクトマネージャが承認した後に変更管理委員会で審議される。"],a:1,
e:"変更管理委員会はコストの増加や期日の延期といった影響を踏まえて変更要求を却下することができます。"},

{q:"システム開発プロジェクトで使用される技法のうち，スケジュール作成に用いる技法として，適切なものだけを全て挙げたものはどれか。\n\na　DFD (Data Flow Diagram)　b　回帰分析\nc　クリティカルパス法　d　プレシデンスダイアグラム法",
c:["a, b","a, d","b, c","c, d"],a:3,
e:"スケジュール作成に用いる技法はクリティカルパス法とプレシデンスダイアグラム法です。DFDはデータフロー分析，回帰分析は統計手法であり，スケジュール作成技法ではありません。"},

{q:"床下にネットワーク配線などのために一定の高さの空間をとり，容易に取り外しが可能なパネルを床板として並べたものはどれか。",
c:["フリーアクセスフロア","フリーアドレス","フリースペース","フリースポット"],a:0,
e:"配線用の空間を確保した取り外し可能な床板はフリーアクセスフロアです。"},

{q:"営業部門の営業員が出張する際の出張旅費の手続に関して，組織間でけん制を日常的に実施している状況の記述として，最も適切なものはどれか。",
c:["営業員が出張後に経理部門に提出した旅費精算の書類と証票類について，経理担当者が適切な内容であることを審査し，経理課長が承認する。","営業員が出張後に旅費の精算を行い，上長が承認を行う。経理部門では承認済みであるので支払を行う。","営業員は出張の事前申請を行って上長の承認を得た後に，切符や宿泊施設の手配を旅行会社に依頼する。","会計年度における営業部門の旅費精算の書類と証票類から，監査人がサンプリングして，営業員の処理内容の適切性を確認する。"],a:0,
e:"営業部門（営業員）が提出した書類を，別組織である経理部門の担当者が審査し，経理課長が承認するという，提出元と確認元が異なる組織間でのチェックが日常的なけん制として機能しています。イは経理部門が営業部門内の承認結果をそのまま受けて支払うだけで経理部門による実質的な確認がなく，エは日常的ではなく年次のサンプリング監査です。"},

{q:"システム開発の早い段階で，目に見える形で利用者の要求が確認できるように確認用のソフトウェアを作成するソフトウェア開発モデルとして，最も適切なものはどれか。",
c:["アジャイル","ウォーターフォール","スパイラル","プロトタイピング"],a:3,
e:"早期に確認用のソフトウェア（試作品）を作成し要求を確認する開発モデルはプロトタイピングモデルです。"},

{q:"計画時の予算が2,000万円で，40日間で100本のプログラムを作成するプロジェクトがある。プロジェクトが20日経過した時点で全体の40%である40本のプログラムが完成し，1,000万円のコストが掛かった。プロジェクトの指標を次の評価式で算出する場合，プロジェクトの指標として適切な組合せはどれか。ここで，各プログラムの作成に必要な日数及びコストは全て同一で，プロジェクト期間中は常に同じ量の作業が実施されるものとする。\n\n〔評価式〕\nスケジュール（%）：（完成したプログラム本数÷評価時点での完成見込みプログラム本数）×100\nコスト（%）：（完成したプログラムに掛かったコスト÷完成したプログラム分として計画したコスト）×100",
c:["80/125","80/100","90/125","90/100"],a:0,
e:"20日時点での計画上の完成見込み本数は100本×(20/40)=50本。スケジュール%＝40/50×100＝80%。完成した40本分の計画コストは2,000万円×(40/100)=800万円。コスト%＝1,000/800×100＝125%。"},

{q:"開発が完了したソフトウェアを本番環境にインストールする手順を明確にし，それを実施する工程として，適切なものはどれか。",
c:["ソフトウェア統合","ソフトウェア導入","妥当性確認","利用者教育"],a:1,
e:"本番環境へのインストール手順を明確にし実施する工程はソフトウェア導入です。"},

{q:"利用者が銀行のATMのパネルを操作して入金処理を行う。この操作の要件を定義するときに，ソフトウェア開発の品質特性である使用性を考慮すべきインタフェースとして，最も適切なものはどれか。",
c:["OSとパネルのインタフェース","ソフトウェア間のインタフェース","ハードウェアとOSのインタフェース","利用者とパネルのインタフェース"],a:3,
e:"使用性（ユーザビリティ）を考慮すべきなのは，実際に人が操作する利用者とパネルのインタフェースです。"},

{q:"顧客から委託されたシステム開発プロジェクトのスコープの対象として，適切なものだけを全て挙げたものはどれか。\n\na　プロジェクトで作成する成果物\nb　プロジェクトで使用する市販のスケジュール管理ツール\nc　プロジェクトの要求事項を顧客が記載した文書",
c:["a","a, b","b, c","c"],a:0,
e:"プロジェクトスコープの対象となるのは，プロジェクトで作成する成果物(a)です。市販のスケジュール管理ツール(b)は作業に使う道具であってスコープの対象ではなく，顧客が記載した要求事項文書(c)はスコープを定義するための入力情報であり，スコープそのもの（成果物や作業範囲）ではありません。"},

{q:"クラウドサービスを提供するA社では，操作に関する質問に対して，サービスデスクのオペレーターが電話で対応するだけでなく，ホームページ上にFAQを公開している。サービスデスクの受付時間は午前9時から午後6時までである。このたびサービスデスクのサービスレベルを向上させるために，顧客向けのチャットボットを導入することにした。チャットボット導入の効果として，最も適切なものはどれか。",
c:["オペレーターのチャットのスキルが向上する。","オペレーターの電話対応のスキルが向上する。","問合せの受付時間を拡大することが可能になる。","ホームページ上に掲載しているFAQの内容が充実する。"],a:2,
e:"チャットボットは自動応答のため，オペレーターの受付時間外にも対応可能となり，問合せ受付時間の拡大につながります。"},

{q:"チャットボットの説明として，最も適切なものはどれか。",
c:["質問に対して，ソフトウェアがリアルタイムで自動応答する仕組み","センサーを搭載した機器や制御装置が直接インターネットにつながり，お互いに情報をやり取りする仕組み","人間に代わって荷物を運ぶなどの作業を行う機械的な仕組み","ルール化された定型的な操作を人間の代わりにソフトウェアが自動で行う仕組み"],a:0,
e:"チャットボットは質問に対しソフトウェアがリアルタイムで自動応答する仕組みです。"},

{q:"社内で開発及び運用を行っている経理システムの内部監査を実施するとき，システム監査人として，最も適切なものはどれか。",
c:["経理システムの運用担当者","経理システムの開発を担当した委託会社の従業員","経理システムの利用者である経理担当者","経理とITの知識を有する経営者直轄組織の従業員"],a:3,
e:"システム監査人には対象業務からの独立性が求められるため，経理とITの知識を有する経営者直轄組織の従業員が最も適切です。"},

{q:"A社は会計システムの再構築のプロジェクトを立ち上げ，システム開発をB社に外部委託している。B社から納品される成果物の検収において，プロジェクトの品質管理に係る手続を遵守しているかどうかのシステム監査を行う監査人として，適切な者は誰か。",
c:["会計システムの再構築に関与しないA社の管理部門のリーダー","会計システムの再構築を担当するA社のプロジェクトマネージャ","会計システムの再構築を担当するB社のシステム開発リーダー","会計システムの再構築を担当するB社の品質管理責任者"],a:0,
e:"監査の独立性を確保するため，プロジェクトに関与しないA社の管理部門のリーダーが適切です。"},

{q:"内部統制の基本的要素の一つである“ITへの対応”に関する記述として，最も適切なものはどれか。",
c:["ITを活用すると業務処理を迅速化でき，不注意によるミスを全て防止できる。","既存のITの利用者の拡大や，使い方の変更などで組織目標を達成できるのであれば，新たなITシステムの導入やITシステムの更新を強いるものではない。","全ての業務プロセスをITで自動化することによって，業務プロセスを大幅に修正することが容易になる。","組織の業務がITに大きく依存すると，内部統制の目的を達成することが難しくなる。"],a:1,
e:"既存ITの活用拡大で組織目標を達成できるなら，必ずしも新規導入や更新を強いるものではないというのが“ITへの対応”の考え方です。"},

{q:"あるコールセンターでは，顧客からの電話による問合せに対応するオペレーターを支援するシステムに，顧客とオペレーターの会話の音声を認識し，顧客の問合せに対する回答の候補をオペレーターのPCの画面に表示するAIを導入した。1日の対応件数は1,000件であり，問合せ内容によって二つのグループA，Bに分けた。AI導入前後の各グループの対応件数，対応時間が表のとおりであるとき，AI導入後に，1,000件の問合せに対応する時間は何%短縮できたか。\n\nグループA：導入前対応件数800件・対応時間は全体の60%，導入後対応件数800件・対応時間は導入前と比べて50%短縮\nグループB：導入前対応件数200件・対応時間は全体の40%，導入後対応件数200件・対応時間は導入前と同じ時間",
c:["30","40","50","60"],a:0,
e:"全体対応時間を100とすると，導入前はグループA=60，グループB=40。導入後はA=60×0.5=30，Bは変わらず40。合計＝70。短縮率＝(100－70)/100＝30%。"},

{q:"システム開発プロジェクトの開始に当たり，人的資源に関する計画書を作成することにした。この計画において，要員を適切に配置し，より良いパフォーマンスを得るために考慮すべき事項として，適切なものだけを全て挙げたものはどれか。\n\na　プロジェクトに必要なスキルが要員に不足している場合は，トレーニングを計画する。\nb　プロジェクトに必要なスキルよりも，要員の確保を常に優先するように計画する。\nc　要員をフレキシブルに配置するために，要員の役割と責任は，プロジェクトの計画段階では明確にせず，プロジェクトの開始後に定める。",
c:["a","a, b, c","a, c","c"],a:0,
e:"スキル不足時のトレーニング計画(a)は適切です。要員確保をスキルより常に優先すること(b)や役割・責任を計画段階で明確にしないこと(c)は，質の高いパフォーマンスを得る上で不適切です。"},

{q:"Bluetoothに追加された仕様の一つであり，省電力性に優れているので，IoTシステムを長期間運用でき，送受信デバイス間の距離を知ることにも使われているものはどれか。",
c:["BLE","IrDA","NFC","PLC"],a:0,
e:"省電力なBluetooth拡張仕様はBLE（Bluetooth Low Energy）です。"},

{q:"HTTPプロキシサーバの機能に関する記述として，適切なものはどれか。",
c:["IPアドレス割当て要求をPCから受け付けて，割り当てるグローバルIPアドレスを返す。","PCから，インターネット上のWebサーバへの接続要求を中継役として受けて，PCに代わって当該のWebサーバに接続し，送受信データを中継する。","WebサーバのURLに対応するIPアドレスを求める要求をPCから受け付けて，そのIPアドレスを返す。","Webサーバのコンテンツが検索結果の上位に表示されるように，そのWebサーバが管理するコンテンツを書き換える。"],a:1,
e:"HTTPプロキシサーバはPCの代わりにWebサーバへ接続し，データを中継する機能をもちます。"},

{q:"DNSの説明として，適切なものはどれか。",
c:["IPネットワークに接続しようとするコンピュータに，IPアドレスなどを自動的に割り当てるプロトコルである。","ブラウザとWebサーバ間の通信を暗号化して，セキュリティを高めるために利用されるプロトコルである。","ホスト名やドメイン名と，IPアドレスを対応付ける仕組みである。","ホスト名やドメイン名と，MACアドレスを対応付ける仕組みである。"],a:2,
e:"DNSはホスト名やドメイン名とIPアドレスを対応付ける仕組みです。"},

{q:"ISMSにおける内部監査に関する記述のうち，適切なものはどれか。",
c:["JIS Q 27001の要求事項及び組織自体が規定した要求事項によって定める監査基準への適合性だけでなく，ISMS活動の組織に対する有効性も判定する。","JIS Q 27001の要求事項ではなく，組織自体が規定した要求事項を監査基準とする。","内部監査の実施のためのプログラムを確立するときには，前回の内部監査の結果は考慮しない。","不定期かつ抜き打ちでの実施を原則とする。"],a:0,
e:"ISMSの内部監査はJIS Q 27001の要求事項と組織自体の要求事項への適合性に加え，有効性も判定します。"},

{q:"TCP/IPネットワークで用いられるプロトコルであるFTPの役割として，適切なものはどれか。",
c:["正確な現在時刻を取得する。","電子メールを転送する。","ネットワーク接続に必要なIPアドレスなどの情報を自動的に割り当てる。","ファイルをPC間で転送する。"],a:3,

{q:"DBMSのトランザクションに関する記述として，適切なものはどれか。",
c:["あるデータベースの内容を他のデータベースに複製し，内容の同期をとる。","データベースに対して行った操作を，順次記録する。","データベースに対する一連の処理が全て成功したら変更結果を確定し，途中で失敗したら処理前の状態に戻す。","データベースの表の索引を作成し，検索時には索引を使用する。"],a:2,
e:"トランザクションは一連の処理が全て成功したら変更を確定し，失敗したら処理前の状態に戻す仕組みです。"},

{q:"OSの仮想記憶方式に関する次の記述中のa〜cに入れる字句の適切な組合せはどれか。\n\nプログラムの実行時に，コンピュータの［a］装置の［b］な容量に制約されない，［c］なアドレス空間を提供する。",
c:["主記憶／物理的／論理的","主記憶／論理的／物理的","補助記憶／物理的／論理的","補助記憶／論理的／物理的"],a:0,
e:"仮想記憶方式は主記憶装置の物理的な容量に制約されない，論理的なアドレス空間を提供します。"},

{q:"データの尺度を名義尺度，順序尺度，間隔尺度，比例尺度の四つに分類したとき，間隔尺度に該当するものはどれか。",

e:"時刻は原点が任意で差に意味がある間隔尺度に該当します。学年は順序尺度，血液型は名義尺度，睡眠時間は比例尺度です。"},

{q:"Webサイトなどで RSSの表記を見かけることがある。このRSSの説明として，適切なものはどれか。",
c:["Webページの統一的なデザインやレイアウトを定義するための規格","Webページの見出しやリンク，要約などを記述するフォーマット","ネットワーク上にブックマークを登録することによって，利用価値の高いWebサイト情報を他の利用者と共有するサービス","ブラウザとWebサーバ間で，データを暗号化して安全に送受信するためのプロトコル"],a:1,
e:"RSSはWebページの見出し・リンク・要約などを記述するフォーマットです。"},

{q:"DBMSにおいて，データの検索を高速に行う目的で，必要に応じて設定して利用する情報はどれか。",
c:["インデックス","外部キー","主キー","スキーマ"],a:0,
e:"検索を高速化するために設定する情報はインデックスです。"},

{q:"関係データベースで管理している次の“ログイン記録”表及び“部署”表において，ログイン結果が失敗となったことのある，又は，2022年4月10日09:00:00以前にログイン結果が成功となったことのある従業員が所属する部署名だけを全て挙げたものはどれか。",
c:["営業部，システム部","営業部，システム部，人事部","営業部，人事部","システム部，人事部"],a:1,
e:"ログイン失敗のある従業員は人事部(003)と営業部(001)の従業員，09:00:00以前に成功した従業員は人事部(003)とシステム部(002)の従業員です。両条件を合わせると営業部・システム部・人事部の全てが該当します。"},

{q:"3次元画像処理の高速化や，動画をなめらかにするなどの機能をもつ，描画処理のためのハードウェアはどれか。",
c:["CGI","GPU","GUI","UPS"],a:1,
e:"描画処理を高速化する専用ハードウェアはGPUです。"},

{q:"CSIRTとして行う活動の例として，最も適切なものはどれか。",
c:["OSやアプリケーションソフトウェアのセキュリティパッチを定期的に適用する。","地震や洪水などの自然災害を想定し，情報資産を守るために全社的な事業継続計画を策定する。","セキュリティ事故の発生時に影響範囲を調査して，被害拡大を防止するための対策実施を支援する。","保守業者がサーバ室で作業した日に，作業員の入退出が適切に記録されていたことを監査する。"],a:2,
e:"CSIRTはセキュリティ事故発生時に影響範囲を調査し，被害拡大防止の対策実施を支援する組織的活動を行います。"},

{q:"バイオメトリクス認証の他人受入率と本人拒否率に関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\nバイオメトリクス認証の認証精度において，他人受入率を低く抑えようとすると［a］が高くなり，本人拒否率を低く抑えようとすると［b］が高くなる。",
c:["安全性／可用性","安全性／利便性","利便性／安全性","利便性／可用性"],a:1,
e:"他人受入率を低く抑えるほど安全性が高まり，本人拒否率を低く抑えるほど利便性が高まります。"},

{q:"情報セキュリティにおける脅威のうち，脆弱性を是正するセキュリティパッチをソフトウェアに適用することが最も有効な対策になるものはどれか。",
c:["総当たり攻撃","ソーシャルエンジニアリング","パスワードリスト攻撃","バッファオーバーフロー"],a:3,
e:"バッファオーバーフローは主にソフトウェアの脆弱性を突く攻撃であり，セキュリティパッチの適用が有効な対策です。"},

{q:"携帯電話で用いられる電波に関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\n電波には，周波数が［a］ほど回り込みやすくなり障害物の裏にも届きやすいという性質がある。日本国内の携帯電話で使用される周波数のうち，700［b］帯〜900［b］帯の周波数帯域はこの性質をもちつながりやすいことなどから，プラチナバンドと呼ばれている。",
c:["高い／GHz","高い／MHz","低い／GHz","低い／MHz"],a:3,
e:"周波数が低いほど回り込みやすく障害物の裏にも届きやすくなります。プラチナバンドは700MHz〜900MHz帯です。"},

{q:"見る人に意図が伝わりやすいデザインにするための四つの原則に関する次の記述中のa，bに入れる字句の適切な組合せはどれか。\n\n近接：互いに関連する要素は近づけてグループにする。\n［a］：要素を意図したルールに基づき配置する。\n反復：要素ごとにデザインルールを繰り返す。\n［b］：要素ごとの大小や強弱などの違いを明確にする。",
c:["整列／価値","整列／対比","操作／価値","操作／対比"],a:1,
e:"デザインの四原則は近接・整列・反復・対比です。要素を意図したルールで配置するのが整列，大小や強弱の違いを明確にするのが対比です。"},

{q:"Webサービスを狙った攻撃に関する記述と攻撃の名称の適切な組合せはどれか。\n\na　Webサービスが利用しているソフトウェアに脆弱性の存在が判明したとき，その修正プログラムが提供される前に，この脆弱性を突いて攻撃する。\nb　複数のコンピュータから大量のパケットを一斉に送り付けることによって，Webサービスを正常に提供できなくさせる。\nc　理論的にあり得るパスワードのパターンを順次試すことによって，正しいパスワードを見つけ，攻撃対象のWebサービスに侵入する。",
c:["DDoS攻撃／ゼロデイ攻撃／ブルートフォース攻撃","DDoS攻撃／ブルートフォース攻撃／ゼロデイ攻撃","ゼロデイ攻撃／DDoS攻撃／ブルートフォース攻撃","ゼロデイ攻撃／ブルートフォース攻撃／DDoS攻撃"],a:2,
e:"修正プログラム公開前の脆弱性攻撃はゼロデイ攻撃，大量パケット送信はDDoS攻撃，パスワードの総当たりはブルートフォース攻撃です。"},

{q:"デジタルフォレンジックスの説明として，適切なものはどれか。",
c:["コンピュータに関する犯罪や法的紛争が生じた際に，コンピュータから削除された電子メールを復元するなどして，証拠を収集し保全すること","システムを実際に攻撃して脆弱性の有無を調べること","通信経路を暗号化するなどして，公衆回線をあたかも専用回線であるかのように利用すること","電子メールやファイルなどのハッシュデータを本人の秘密鍵で暗号化すること"],a:0,
e:"デジタルフォレンジックスは犯罪や法的紛争の際に電子的証拠を収集・保全することです。"},

{q:"次の記憶媒体のうち，記憶素子として半導体メモリを用いているものだけを全て挙げたものはどれか。\n\na　CD-ROM　b　DVD-RAM　c　RAM　d　SSD　e　USBメモリ",
c:["a, b, c","a, b, e","c, d, e","c, e"],a:2,
e:"RAM，SSD，USBメモリは半導体メモリを記憶素子として用いています。CD-ROMとDVD-RAMは光ディスクです。"},

{q:"商品の税込価格を計算する表計算のワークシートがある。セルB1には消費税率が入力されており，セルB4〜B6には税抜価格が入力されている。セルC4〜C6に税込価格を表示するために，セルC4に式を入力し，セルC5，C6に複写する。セルC4に入力する式はどれか。ここで，セルB1は，パーセント形式で表示している。",
c:["B$4*(1+B$1)","B$4*(1+B1)","B4*(1+B$1)","B4*(1+B1)"],a:2,
e:"税抜価格を格納するB4は複写先に応じて行番号を変えたいので相対参照，税率が入っているB1は常に固定で参照したいので絶対参照（B$1）にします。よって式はB4*(1+B$1)です。"},

{q:"ネットワークやホストを監視することによって，不正アクセスや不審な通信を発見し，報告する仕組みはどれか。",
c:["DMZ","IDS","アンチパスバック","ボット"],a:1,
e:"ネットワークやホストを監視し不正アクセスや不審な通信を発見・報告する仕組みはIDS（侵入検知システム）です。"},

{q:"手続 calcMod3を呼び出したときの出力はどれか。\n\n〔プログラム〕\n〇calcMod3()\n　整数型: totalValue, i\n　totalValue ← 0\n　for (iを1から7まで1ずつ増やす)\n　　if (i ÷ 3の余り が 0と等しい)\n　　　totalValue ← totalValue + i\n　　endif\n　endfor\n　totalValue を出力する",
c:["2","3","7","9"],a:3,
e:"iが1〜7のうち3で割り切れる値は3と6です。totalValue＝3+6＝9が出力されます。"},

{q:"サムネイルの説明として，適切なものはどれか。",
c:["画像や文書ファイルの内容を縮小して表示したもの","処理の内容や対象が分かる小さな絵や記号のこと","ネット上で利用者の分身として動作するキャラクターのこと","複数のファイルを一つのファイルにまとめたもの"],a:0,
e:"サムネイルは画像や文書ファイルの内容を縮小して表示したものです。"},

{q:"AIにおいて，広範囲かつ大量のデータで訓練されたものであり，ファインチューニングなどによって文章生成AIのような様々な用途に適応できる特徴をもつものを何というか。",
c:["アノテーション","エキスパートシステム","基盤モデル","畳み込みニューラルネットワーク"],a:2,

{q:"イメージスキャナーで読み取った紙の書類の画像から，印刷文字や手書きの文字を読み取り，テキストデータに変換する技術を何と呼ぶか。",
c:["CCD","DVI","GPU","OCR"],a:3,
e:"画像から文字を読み取りテキストデータに変換する技術はOCR（光学文字認識）です。"},

{q:"あるコンピュータのデータベースの内容を他のコンピュータのデータベースに複製して，両者の内容が一致するように同期させるDBMSの機能はどれか。",
c:["アーカイブ","バックアップ","レプリケーション","ロールバック"],a:2,

{q:"ISMSの運用にPDCAモデルを採用している組織において，サーバ監視に関する次の作業を実施する。各作業とPDCAモデルの各フェーズの組合せとして，適切なものはどれか。\n\n〔作業〕\n(1) サーバ監視の具体的な目的及び手順を定める。\n(2) サーバ監視の作業内容を第三者が客観的に評価する。\n(3) 定められている手順に従ってサーバを監視する。\n(4) 発見された問題点の是正処置として，サーバの監視方法を変更する。",
c:["P(1) D(2) C(3) A(4)","P(1) D(2) C(4) A(3)","P(1) D(3) C(2) A(4)","P(1) D(3) C(4) A(2)"],a:2,
e:"目的・手順を定める(1)がPlan，手順に従って実施する(3)がDo，第三者が評価する(2)がCheck，是正処置(4)がActです。"},

{q:"ISMSにおける情報セキュリティ方針に関する記述として，適切なものはどれか。",
c:["機密事項が記載されているので，伝達する範囲を社内に限定する必要がある。","情報セキュリティ対策は一度実施したら終わりではないので，ISMSを継続的に改善するコミットメントを含める必要がある。","部門の特性に応じて最適化するので，ISMSを適用する組織全体ではなく，部門ごとに定める必要がある。","ボトムアップを前提としているので，各職場の管理者によって承認される必要がある。"],a:1,
e:"情報セキュリティ方針にはISMSを継続的に改善するというコミットメントを含める必要があります。"},

{q:"問題を解いて解答群の中から正解を選ぶ，あるAIシステムがある。このシステムは，1回の学習の過程を経るごとに，学習の過程の前後の比較において，誤り率が5%低下する（前回の誤り率の95%になる）。現在の正解率が30%であるとき，正解率が35%を超えるためには，少なくともあと何回の学習の過程が必要か。",
c:["1","2","3","4"],a:1,
e:"現在の誤り率は70%。誤り率が0.95倍ずつ低下し，正解率35%超＝誤り率65%未満になる回数を求めます。70×0.95=66.5（1回，まだ65%以上），70×0.95²=63.175（2回で65%未満）。よって2回必要です。"},

{q:"情報セキュリティ対策を，“技術的セキュリティ対策”，“人的セキュリティ対策”及び“物理的セキュリティ対策”に分類したとき，“物理的セキュリティ対策”の例として，適切なものはどれか。",
c:["業務に関係のない掲示板やSNSなどへの従業員による書込み，閲覧を防止するために，Webサーバへのアクセスログを取得し，必要に応じて通信を遮断する。","サーバ室，執務室などの場所ごとにセキュリティレベルを設定し，従業員ごとのアクセス権が付与されたICカードで入退室管理を行う。","従業員の採用時には，守秘義務に関する契約書を取り交わし，在籍中は機密情報の取扱いに関する教育，啓発を実施する。","退職者が，在籍中のアカウントを用いた不正アクセスを行わないように，従業員の退職時にアカウントを削除する。"],a:1,
e:"場所ごとのセキュリティレベル設定とICカードによる入退室管理は物理的セキュリティ対策の例です。"},

{q:"Aさんは，Bさんから次の4種類のメッセージを受け取った。Aさんが，受け取ったメッセージを復号して読むことができるものだけを全て挙げたものはどれか。\n\na　AさんとBさんとの共通鍵で暗号化したメッセージ\nb　Aさんの公開鍵で暗号化したメッセージ\nc　Bさんの公開鍵で暗号化したメッセージ\nd　Bさんの秘密鍵で暗号化したメッセージ",
c:["a, b, d","a, c, d","b, d","c, d"],a:0,
e:"共通鍵で暗号化されたもの(a)は共通鍵を知るAさんが復号可能。Aさんの公開鍵で暗号化されたもの(b)はAさんの秘密鍵で復号可能。Bさんの秘密鍵で暗号化されたもの(d)は公開されているBさんの公開鍵で誰でも復号可能です。Bさんの公開鍵で暗号化されたもの(c)はBさんの秘密鍵がないと復号できません。"},

{q:"無線LANのセキュリティ対策に関する記述として，適切なものはどれか。",
c:["APIは，複数のアクセスポイントをグループ化して管理するIDである。","SSHは，アクセスポイントをステルス化することで無線LANネットワークを隠蔽する機能である。","VPNは，アクセスポイントに登録したMACアドレスをもつ機器以外からの接続を拒否する機能である。","WPA2は，WEPよりも高い信頼性をもつ，無線通信の暗号化技術である。"],a:3,
e:"WPA2はWEPよりも高い信頼性をもつ無線通信の暗号化技術です。"},

{q:"情報セキュリティのリスクマネジメントにおけるリスク対応を，リスク移転，リスク回避，リスク低減及びリスク保有の四つに分けて実施することにしたとき，これらに関する記述として，適切なものはどれか。",
c:["リスク対応の実施手順であり，リスク回避，リスク移転，リスク低減，リスク保有の順番で進める。","リスク対応の実施手順であり，リスク保有，リスク低減，リスク移転，リスク回避の順番で進める。","リスク対応の選択肢であり，管理対象としたリスクの顕在化に備えて保険を掛けておくことは，リスク回避に該当する。","リスク対応の選択肢であり，ノートPCの紛失や盗難に備えて社外への持出しをより厳重に管理することは，リスク低減に該当する。"],a:3,
e:"リスク対応は決まった順番があるものではなく，リスクごとに選択する対応策です。持出し管理の厳格化はリスクの発生確率や影響を下げるリスク低減に該当します。保険を掛けるのはリスク移転に該当します。"},

{q:"従業員が使用するPCがランサムウェアに感染した場合の損害を軽減する対策例として，適切なものはどれか。",
c:["PCが接続するファイルサーバのHDDのバックアップデータを定期的に取得し，ネットワークから切り離して保管する。","PCに多要素認証の仕組みを導入する。","PCのHDDを暗号化する。","PCへのログイン時に，パスワードを複数回間違えたら，当該IDをロックする。"],a:0,
e:"ランサムウェア被害後の復旧に有効なのは，ネットワークから切り離したバックアップデータの保管です。"},

{q:"情報セキュリティにおける脅威の説明として，適切なものはどれか。",
c:["攻撃者が付け込むことのできる情報システムの弱点","情報資産が被害に遭う確率と被害規模の組合せ","情報資産に損害を与える原因となるもの","情報システムの弱点を利用した攻撃によって被害を受ける可能性"],a:2,
e:"脅威は情報資産に損害を与える原因となるものを指します。アは脆弱性，イ・エはリスクの説明です。"},

{q:"稼働率0.9の装置で並列システムを構成したい。このシステムの稼働率を0.999とするためには，最低何台の装置で並列システムを構成する必要があるか。ここで，並列システムを構成したときに，少なくとも1台の装置が稼働していればシステムは正常に稼働しているものとする。",
c:["2","3","4","5"],a:1,
e:"n台のうち少なくとも1台稼働の確率は1-(1-0.9)^n。n=2: 1-0.01=0.99（不足）。n=3: 1-0.001=0.999（条件を満たす）。よって最低3台必要です。"},

{q:"データベース設計におけるデータ分析で行うこととして，適切なものはどれか。",
c:["データウェアハウスから業務ごとに必要な情報を抽出する。","データ項目の内容が，指定された条件を満足する行だけを抽出する。","必要なデータ項目を洗い出し，項目間の関連を整理する。","膨大な情報から統計的手法などを用いて，ビジネスに活用できる情報を探索する。"],a:2,

{q:"OSS (Open Source Software) に関する次の記述のうち，適切なものだけを全て挙げたものはどれか。\n\na　個人だけではなく，企業や団体が開発したソフトウェアもある。\nb　著作権が放棄されている。\nc　入手したソフトウェアは，自由に再配布してもよい。",
c:["a, b","a, b, c","a, c","b, c"],a:2,

{q:"情報セキュリティにおいて，可用性が損なわれた事象だけを全て挙げたものはどれか。\n\na　関連取引先との電子決済システムがDoS攻撃を受け，処理ができなくなった。\nb　顧客情報管理システムの顧客情報が誤った内容のまま運用されていた。\nc　社内のサーバに不正侵入されて，社外秘の情報が漏えいした。",
c:["a","a, b","b, c","c"],a:0,
e:"DoS攻撃によるサービス停止(a)は可用性が損なわれた事象です。誤った情報のまま運用(b)は完全性，情報漏えい(c)は機密性が損なわれた事象です。"},

{q:"4個の要素から成るデータの並びを，次の手順を繰り返して昇順に整列するとき，整列が終了するまでに(1)から(3)の一連の手順は，何回実行されるか。ここで，最初はデータの並び全体を整列対象とする。\n\nデータの並び：[27, 42, 33, 12]\n\n〔手順〕\n(1) 整列対象中の要素の最大の値を選び，最後の要素と入れ替える。\n(2) 最後の要素を整列対象から外す。\n(3) 整列対象に要素が1個以上残っていれば，(1)から(3)の一連の手順を実行する。残っていなければ，整列完了なので終了する。",
c:["2","3","4","5"],a:2,
e:"4要素→3要素→2要素→1要素と整列対象を1つずつ減らしながら手順を繰り返し，1要素が残っている間は再度実行するため，合計4回実行されます。"},

{q:"関数calculateAmountOfPrizeは，業務改善の効果における改善額と短縮期間を，それぞれimprovementとperiodで受け取り，賞金額を戻り値とする。改善額が20万円で短縮期間が3日の業務改善と，改善額が5万円で短縮期間が14日の業務改善があった。この二つの賞金額の合計は何円か。ここで，改善額と短縮期間の値はそれぞれ0以上とする。",

c:["AIの発展によって人も併せて進化するように，国際化や多様化を推進し，大学，研究機関，企業など，官民における連携と，柔軟な人材の移動を促進する。","AIの利用がもたらす結果については，問題の特性に応じて，AIの開発，提供，利用に携わった関係者が分担して責任を負う。","サービスの提供者は，AIを利用している事実やデータの取得方法や使用方法，結果の適切性について，利用者に対する適切な説明を行う。","情報弱者を生み出さないために，幼児教育や初等中等教育において，AI活用や情報リテラシーに関する教育を行う。"],a:0,
e:"イノベーションの原則は，官民連携や柔軟な人材移動の促進など，国際的な協調とイノベーション環境の整備を求めるものです。"},

{q:"金融機関では，同一の顧客で複数の口座をもつ個人や法人について，氏名又は法人名，生年月日又は設立年月日，電話番号，住所又は所在地などを手掛かりに集約し，顧客ごとの預金の総額を正確に把握する作業が行われる。このように顧客がもつ複数の口座を，顧客ごとに取りまとめて一元管理する手続を表す用語として，最も適切なものはどれか。",
c:["アカウントアグリゲーション","キーマッピング","垂直統合","名寄せ"],a:3,
e:"複数口座を顧客ごとに取りまとめて一元管理する手続は名寄せと呼ばれます。"},

{q:"ある商品の販売量と気温の関係が一次式で近似できるとき，予測した気温から商品の販売量を推定する手法として，適切なものはどれか。",
c:["回帰分析","線形計画法","デルファイ法","パレート分析"],a:0,
e:"一次式で近似した関係から値を推定する手法は回帰分析です。"},

{q:"必要な時期に必要な量の原材料や部品を調達することによって，工程間の在庫をできるだけもたないようにする生産方式はどれか。",
c:["BPO","CIM","JIT","OEM"],a:2,
e:"必要な時に必要な量を調達し在庫を持たない生産方式はJIT（ジャストインタイム）です。"},

{q:"RPAが適用できる業務として，最も適切なものはどれか。",
c:["ゲームソフトのベンダーが，ゲームソフトのプログラムを自動で改善する業務","従業員の交通費精算で，交通機関利用区間情報と領収書データから精算伝票を作成する業務","食品加工工場で，産業用ロボットを用いて冷凍食品を自動で製造する業務","通信販売業で，膨大な顧客の購買データから顧客の購買行動に関する新たな法則を見つける業務"],a:1,
e:"定型的なPC操作を自動化するRPAは，交通費精算のような事務作業の自動化に適しています。"},

{q:"技術開発戦略において作成されるロードマップを説明しているものはどれか。",
c:["技術の競争力レベルと技術のライフサイクルを2軸としたマトリックス上に，自社の技術や新しい技術をプロットする。","研究開発への投資とその成果を2軸とした座標上に，技術の成長過程をグラフ化し，旧技術から新技術への転換状況を表す。","市場面からの有望度と技術面からの有望度を2軸としたマトリックス上に，技術開発プロジェクトをプロットする。","横軸に時間，縦軸に市場，商品，技術などを示し，研究開発成果の商品化，事業化の方向性をそれらの要素間の関係で表す。"],a:3,
e:"ロードマップは横軸に時間，縦軸に市場・商品・技術などを示し，将来の方向性を関係性で表すものです。"},

{q:"コーポレートガバナンスを強化した事例として，最も適切なものはどれか。",
c:["女性が活躍しやすくするために労務制度を拡充した。","迅速な事業展開のために，他社の事業を買収した。","独立性の高い社外取締役の人数を増やした。","利益が得られにくい事業から撤退した。"],a:2,
e:"独立性の高い社外取締役を増やすことは経営監視機能を強化し，コーポレートガバナンスの強化につながります。"},

{q:"ある銀行では，システムの接続仕様を外部に公開し，あらかじめ契約を結んだ外部事業者のアクセスを認めることによって，利便性の高い，高度なサービスを展開しやすくしている。このような取組を表す用語として，最も適切なものはどれか。",
c:["BPO","RPA","オープンAPI","技術経営"],a:2,
e:"接続仕様を外部に公開し外部事業者のアクセスを認める取組はオープンAPIです。"},

{q:"A社では，1千万円を投資して営業支援システムを再構築することを検討している。現状の営業支援システムの運用費が5百万円／年，再構築後の営業支援システムの運用費が4百万円／年，再構築による新たな利益の増加が2百万円／年であるとき，この投資の回収期間は何年か。ここで，これら以外の効果，費用などは考慮しないものとし，計算結果は小数点以下第2位を四捨五入するものとする。",
c:["2.5","3.3","5.0","10.0"],a:1,
e:"年間の効果は運用費削減1百万円＋利益増加2百万円＝3百万円。投資額1,000万円÷300万円＝3.33年です。"},

{q:"あるソフトウェアは，定額の料金や一定の期間での利用ができる形態で提供されている。この利用形態を表す用語として，適切なものはどれか。",
c:["アクティベーション","アドウェア","サブスクリプション","ボリュームライセンス"],a:2,
e:"定額料金や一定期間での利用形態はサブスクリプションです。"},

{q:"インターネットを介して個人や企業が保有する住宅などの遊休資産の貸出しを仲介するサービスや仕組みを表す用語として，最も適切なものはどれか。",
c:["シェアードサービス","シェアウェア","シェアリングエコノミー","ワークシェアリング"],a:2,
e:"遊休資産の貸出しを仲介する仕組みはシェアリングエコノミーです。"},

{q:"A社はRPAソフトウェアを初めて導入するに当たり，計画策定フェーズ，先行導入フェーズ，本格導入フェーズの3段階で進めようと考えている。次のうち，計画策定フェーズで実施する作業として，適切なものだけを全て挙げたものはどれか。\n\na　RPAソフトウェアの適用可能性を見極めるための概念検証を実施する。\nb　RPAソフトウェアを全社展開するための導入と運用の手順書を作成する。\nc　部門，業務を絞り込んでRPAソフトウェアを導入し，効果を実測する。",
c:["a","a, c","b","b, c"],a:0,
e:"計画策定フェーズでは適用可能性を見極める概念検証（PoC）を実施します。bは本格導入フェーズ，cは先行導入フェーズの作業です。"},

{q:"式は定期発注方式で原料の発注量を求める計算式である。a〜cに入れる字句の適切な組合せはどれか。\n\n発注量＝（［a］＋調達期間）×毎日の使用予定量＋［b］－現在の在庫量－［c］",
c:["営業日数／安全在庫量／現在の発注残","営業日数／現在の発注残／安全在庫量","発注間隔／安全在庫量／現在の発注残","発注間隔／現在の発注残／安全在庫量"],a:2,
e:"定期発注方式では発注間隔と調達期間の合計期間分の使用量に安全在庫量を加え，現在庫と発注残を差し引いて発注量を求めます。"},

{q:"史跡などにスマートフォンを向けると，昔あった建物の画像や説明情報を現実の風景と重ねるように表示して，観光案内をできるようにした。ここで活用した仕組みを表す用語として，最も適切なものはどれか。",
c:["AR","GUI","VR","メタバース"],a:0,
e:"現実の風景に情報を重ねて表示する仕組みはAR（拡張現実）です。"},

{q:"データサイエンティストの役割に関する記述として，最も適切なものはどれか。",
c:["機械学習や統計などの手法を用いてビッグデータを解析することによって，ビジネスに活用するための新たな知見を獲得する。","企業が保有する膨大なデータを高速に検索できるように，パフォーマンスの高いデータベースを運用するためのシステム基盤を構築する。","企業における情報システムに関するリスクを評価するために，現場でのデータの取扱いや管理についての実態を調査する。","企業や組織における安全な情報システムの企画，設計，開発，運用を，サイバーセキュリティに関する専門的な知識や技能を活用して支援する。"],a:0,
e:"データサイエンティストは機械学習や統計手法でビッグデータを解析し，ビジネスに活用する新たな知見を得る役割を担います。"},

{q:"個人情報保護法では，あらかじめ本人の同意を得ていなくても個人データの提供が許される行為を規定している。この行為に該当するものだけを，全て挙げたものはどれか。\n\na　事故で意識不明の人がもっていた本人の社員証を見て，搬送先の病院が本人の会社に電話してきたので，総務の担当者が本人の自宅電話番号を教えた。\nb　新規加入者を勧誘したいと保険会社の従業員に頼まれたので，総務の担当者が新入社員の名前と所属部門のリストを渡した。\nc　不正送金等の金融犯罪被害者に関する個人情報を，類似犯罪の防止対策を進める捜査機関からの法令に基づく要請に応じて，総務の担当者が提供した。",
c:["a","a, c","b, c","c"],a:1,
e:"人の生命・身体保護のため緊急を要する場合(a)や法令に基づく捜査機関への提供(c)は同意なしでの提供が認められます。保険勧誘目的での名簿提供(b)は本人同意が必要です。"},

{q:"次の事例のうち，AIを導入することによって業務の作業効率が向上したものだけを全て挙げたものはどれか。\n\na　食品専門商社のA社が，取引先ごとに様式が異なる手書きの請求書に記載された文字を自動で読み取ってデータ化することによって，事務作業時間を削減した。\nb　繊維製造会社のB社が，原材料を取引先に発注する定型的なPCの操作を自動化するツールを導入し，事務部門の人員を削減した。\nc　損害保険会社のC社が，自社のコールセンターへの問合せに対して，オペレーターにつなげる前に音声チャットボットでヒアリングを行うことによって，オペレーターの対応時間を短縮した。\nd　物流会社のD社が，配送荷物に電子タグを装着して出荷時に配送先を電子タグに書き込み，配送時にそれを確認することによって，誤配送を削減した。",
c:["a, c","b, c","b, d","c, d"],a:0,
e:"AIによる作業効率向上の例は，手書き文字の自動読取(a)と音声チャットボットによる対応時間短縮(c)です。bはRPA，dは電子タグ技術であり，AI導入による効率化とは異なります。"},

{q:"ある企業が，顧客を引き付ける優れたUX（User Experience）やビジネスモデルをデジタル技術によって創出し，業界における従来のサービスを駆逐してしまうことによって，その業界の既存の構造が破壊されるような現象を表す用語として，最も適切なものはどれか。",
c:["デジタルサイネージ","デジタルディスラプション","デジタルディバイド","デジタルトランスフォーメーション"],a:1,
e:"デジタル技術によって既存業界の構造が破壊される現象はデジタルディスラプションです。"},

{q:"上司から自社の当期の損益計算書を渡され，“我が社の収益性分析をしなさい”と言われた。経営に関する指標のうち，この損益計算書だけから計算できるものだけを全て挙げたものはどれか。\n\na　売上高増加率　b　売上高利益率　c　自己資本利益率",
c:["a","a, b","a, b, c","b"],a:3,
e:"売上高利益率(b)は損益計算書のみで計算できます。売上高増加率(a)は前期の損益計算書も必要，自己資本利益率(c)は貸借対照表の自己資本も必要です。"},

{q:"顧客との個々のつながりを意識して情報を頻繁に更新するSNSなどのシステムとは異なり，会計システムのように高い信頼性と安定稼働が要求される社内情報を扱うシステムの概念を示す用語として，最も適切なものはどれか。",
c:["IoT (Internet of Things)","PoC (Proof of Concept)","SoE (Systems of Engagement)","SoR (Systems of Record)"],a:3,
e:"高い信頼性と安定稼働が求められる記録系システムの概念はSoR（Systems of Record）です。"},

{q:"労働者派遣における派遣労働者の雇用関係に関する記述のうち，適切なものはどれか。",
c:["派遣先との間に雇用関係があり，派遣元との間には存在しない。","派遣元との間に雇用関係があり，派遣先との間には存在しない。","派遣元と派遣先のいずれの間にも雇用関係が存在する。","派遣元と派遣先のいずれの間にも雇用関係は存在しない。"],a:1,
e:"労働者派遣では，派遣労働者は派遣元と雇用関係を結び，派遣先とは指揮命令関係のみで雇用関係はありません。"},

{q:"次の記述のうち，業務要件定義が曖昧なことが原因で起こり得る問題だけを全て挙げたものはどれか。\n\na　企画プロセスでシステム化構想がまとまらず，システム化の承認を得られない。\nb　コーディングのミスによって，システムが意図したものと違う動作をする。\nc　システムの開発中に仕様変更による手戻りが頻発する。\nd　システムを受け入れるための適切な受入れテストを設計できない。",
c:["a, b","b, c","b, d","c, d"],a:3,
e:"業務要件定義の曖昧さは仕様変更による手戻り(c)や受入れテスト設計の困難(d)を招きます。aは企画プロセス，bはコーディングミスが原因であり業務要件定義の曖昧さとは異なります。"},

{q:"顧客の特徴に応じたきめ細かい対応を行うことによって，顧客と長期的に良好な関係を築き，顧客満足度の向上や取引関係の継続につなげる仕組みを構築したい。その仕組みの構成要素の一つとして，営業活動で入手した顧客に関する属性情報や顧客との交渉履歴などを蓄積し，社内で共有できるシステムを導入することにした。この目的を達成できるシステムとして，最も適切なものはどれか。",
c:["CAEシステム","MRPシステム","SCMシステム","SFAシステム"],a:3,
e:"顧客属性情報や交渉履歴を蓄積・共有し営業活動を支援するシステムはSFA（営業支援）システムです。"},

{q:"実用新案に関する記述として，最も適切なものはどれか。",
c:["今までにない製造方法は，実用新案の対象となる。","自然法則を利用した技術的思想の創作で高度なものだけが，実用新案の対象となる。","新規性の審査に合格したものだけが実用新案として登録される。","複数の物品を組み合わせて考案した新たな製品は，実用新案の対象となる。"],a:1,
e:"実用新案の対象は，自然法則を利用した技術的思想の創作（考案）です。実用新案法における考案の定義に基づき，イが適切な記述となります。"},

{q:"プロジェクトに該当する事例として，適切なものだけを全て挙げたものはどれか。\n\na　会社合併に伴う新組織への移行\nb　社内システムの問合せや不具合を受け付けるサービスデスクの運用\nc　新規の経理システム導入に向けたプログラム開発\nd　毎年度末に実施する会計処理",
c:["a, c","b, c","b, d","c"],a:3,
e:"プロジェクトは有期性・独自性をもつ活動です。新規経理システム導入のプログラム開発(c)はプロジェクトに該当しますが，合併に伴う組織移行(a)は通常の組織変更活動，サービスデスク運用(b)や毎年度末の会計処理(d)は定常業務であり該当しません。"},

{q:"システム開発プロジェクトを終結する時に，プロジェクト統合マネジメントで実施する活動として，最も適切なものはどれか。",
c:["工程の進捗の予定と実績の差異を分析する。","作成した全ての成果物の一覧を確認する。","総費用の予算と実績の差異を分析する。","知識や教訓を組織の資産として登録する。"],a:1,
e:"プロジェクト終結時のプロジェクト統合マネジメントでは，作成した全成果物の一覧を確認し，正式に完了を確認します。"},

{q:"あるシステムの運用において，利用者との間でSLAを交わし，利用可能日を月曜日から金曜日，1日の利用可能時間を7時から22時まで，稼働率を98％以上で合意した。1週間の運用において，障害などでシステムの停止を許容できる時間は最大何時間か。",
c:["0.3","1.5","1.8","2.1"],a:1,
e:"1週間の利用可能時間＝(22－7)×5＝75時間。稼働率98%以上のため停止許容時間＝75×0.02＝1.5時間です。"},

{q:"サービスデスクを評価するためには適切なKPIを定めて評価する必要がある。顧客満足度を高めるために値が小さい方が良いKPIとして，適切なものだけを全て挙げたものはどれか。\n\na　SLAで合意された目標時間内に対応が完了したインシデント件数の割合\nb　1回の問合せで解決ができたインシデント件数の割合\nc　二次担当へエスカレーションされたインシデント件数の割合\nd　利用者がサービスデスクの担当者につながるまでに費やした時間",
c:["a, b","a, d","b, c","c, d"],a:3,
e:"エスカレーション割合(c)や担当者につながるまでの待ち時間(d)は，値が小さいほど顧客満足度が高まるKPIです。aとbは値が大きい方が良いKPIです。"},

{q:"アジャイル開発に関する記述として，最も適切なものはどれか。",
c:["開発する機能を小さい単位に分割して，優先度の高いものから短期間で開発とリリースを繰り返す。","共通フレームを適用して要件定義，設計などの工程名及び作成する文書を定義する。","システム開発を上流工程から下流工程まで順番に進めて，全ての開発工程が終了してからリリースする。","プロトタイプを作成して利用者に確認を求め，利用者の評価とフィードバックを行いながら開発を進めていく。"],a:0,
e:"アジャイル開発は機能を小さい単位に分割し，優先度の高いものから短期間で開発・リリースを繰り返す手法です。"},

{q:"あるプロジェクトの作業間の関係と所要時間がアローダイアグラムで示されている。このアローダイアグラムのBからEの四つの結合点のうち，工程全体の完了時間に影響を与えることなく，その結合点から始まる全ての作業の開始を最も遅らせることができるものはどれか。ここで，各結合点から始まる作業はその結合点に至る作業が全て完了するまで開始できず，作業から次の作業への段取り時間は考えないものとする。\n\nA→B(15) A→C(10) B→D(10) B→E(25) C→E(15) D→F(20) E→F(15)",
c:["B","C","D","E"],a:1,
e:"最長経路（クリティカルパス）はA→B→E→F＝15+25+15＝55です。A→C→E→Fの経路は10+15+15＝40で，クリティカルパスとの差（余裕）は15あります。したがって結合点Cが，全体の完了時間に影響を与えることなく最も遅らせることができます。"},

{q:"システム監査人の役割として，適切なものだけを全て挙げたものはどれか。\n\na　監査手続の種類，実施時期，適用範囲などについて，監査計画を立案する。\nb　監査の目的に応じた監査報告書を作成し，社内に公開する。\nc　監査報告書にある改善提案に基づく改善の実施を監査対象部門に指示する。\nd　監査報告書にある改善提案に基づく改善の実施状況をモニタリングする。",
c:["a, b","a, d","b, c","c, d"],a:1,
e:"システム監査人は監査計画の立案(a)や改善実施状況のモニタリング(d)を行います。改善の実施を指示する(c)ことは監査対象部門の責任であり，監査人の役割ではありません。"},

{q:"情報システムに関する施設や設備を維持・保全するために行うリスク対策のうち，ファシリティマネジメントの観点から行う対策として，適切なものだけを全て挙げたものはどれか。\n\na　コンピュータ室への入室を，認可した者だけに限定する。\nb　コンピュータの設置場所を示す標識を掲示しない。\nc　利用者のPCにマルウェア対策ソフトを導入する。",

{q:"ソフトウェアの開発におけるDevOpsに関する記述として，最も適切なものはどれか。",
c:["開発側が重要な機能のプロトタイプを作成し，顧客とともにその性能を実測して妥当性を評価する。","開発側では，開発の各工程でその工程の完了を判断した上で次工程に進み，総合テストで利用者が参加して操作性の確認を実施した後に運用側に引き渡す。","開発側と運用側が密接に連携し，自動化ツールなどを活用して機能の導入や更新などを迅速に進める。","システム開発において，機能の拡張を図るために，固定された短期間のサイクルを繰り返しながらプログラムを順次追加する。"],a:2,

{q:"ソフトウェア開発プロジェクトにおける，コストの見積手法には，積み上げ法，ファンクションポイント法，類推見積法などがある。見積りで使用した手法とその特徴に関する記述a〜cの適切な組合せはどれか。\n\na　プロジェクトに必要な個々の作業を洗い出し，その作業ごとの工数を見積もって集計する。\nb　プロジェクトの初期段階で使用する手法で，過去の事例を活用してコストを見積もる。\nc　データ入出力や機能に着目して，ソフトウェア規模を見積もり，係数を乗ずるなどしてコストを見積もる。",
c:["a／c／b","b／a／c","c／a／b","c／b／a"],a:2,
e:"積み上げ法は個々の作業を洗い出し工数を集計する手法，ファンクションポイント法はデータ入出力や機能に着目し規模を見積もる手法，類推見積法は過去の事例を活用する手法です。"},

{q:"ソフトウェア製品の品質特性を，移植性，機能適合性，互換性，使用性，信頼性，性能効率性，セキュリティ，保守性に分類したとき，RPAソフトウェアの使用性に関する記述として，最も適切なものはどれか。",

e:"使用性は利用者にとっての使いやすさを表す特性です。指定した条件に基づき適切に処理が実行されることも，利用者が迷わず使える点で使用性に関わる要素として扱われます。"},

{q:"システム開発プロジェクトにおいて，テスト中に発見された不具合の再発防止のために不具合分析を行うことにした。テスト結果及び不具合の内容を表に記入し，不具合ごとに根本原因を突き止めた後に，根本原因ごとに集計を行い発生頻度の多い順に並べ，主要な根本原因の特定を行った。ここで利用した図表のうち，根本原因を集計し，発生頻度順に並べて棒グラフで示し，累積値を折れ線グラフで重ねて示したものはどれか。",

{q:"関数convertは，整数型の配列を一定のルールで文字列に変換するプログラムである。関数convertをconvert(arrayInput)として呼び出したときの戻り値が“AABAB”になる引数arrayInputの値はどれか。ここで，arrayInputの要素数は1以上とし，配列の要素番号は1から始まる。\n\n〔プログラム〕\n文字列型：convert(整数型の配列：arrayInput)\n　文字列型：stringOutput←\"\"\n　整数型：i\n　for(iを1からarrayInputの要素数まで1ずつ増やす)\n　　if(arrayInput[i]が1と等しい)\n　　　stringOutputの末尾に\"A\"を追加する\n　　else\n　　　stringOutputの末尾に\"B\"を追加する\n　　endif\n　endfor\n　return stringOutput",
c:["{0, 0, 1, 2, 1}","{0, 1, 2, 1, 1}","{1, 0, 1, 2, 0}","{1, 1, 2, 1, 0}"],a:3,
e:"“AABAB”は1のとき\"A\"，1以外のとき\"B\"に対応するので，各要素は1,1,非1,1,非1という並びになります。選択肢エ{1,1,2,1,0}がこれに一致します。"},

{q:"情報セキュリティのリスクマネジメントにおけるリスクへの対応を，リスク共有，リスク回避，リスク保有及びリスク低減の四つに分類するとき，リスク共有の例として，適切なものはどれか。",

{q:"AIにおける機械学習の学習方法に関する次の記述中のa〜cに入れる字句の適切な組合せはどれか。\n\n教師あり学習は，正解を付けた学習データを入力することによって，［a］と呼ばれる手法で未知のデータを複数のクラスに分けたり，［b］と呼ばれる手法でデータの関係性を見つけたりすることができるようになる学習方法である。教師なし学習は，正解を付けない学習データを入力することによって，［c］と呼ばれる手法などで次第にデータを正しくグループ分けできるようになる学習方法である。",

e:"CA（認証局）は公開鍵証明書の発行・失効を行い，鍵の正当性を保証する役割を担います。"},

{q:"図に示す2台のWebサーバと1台のデータベースサーバから成るWebシステムがある。Webサーバの稼働率はともに0.8とし，データベースサーバの稼働率は0.9とすると，このシステムの小数第3位を四捨五入した稼働率は幾らか。ここで，2台のWebサーバのうち少なくとも1台が稼働していて，かつ，データベースサーバが稼働していれば，システムとしては稼働しているとみなす。また，それぞれのサーバはランダムに故障が起こるものとする。",
c:["0.04","0.58","0.86","0.96"],a:2,
e:"Webサーバ2台のうち少なくとも1台稼働する確率＝1－(1－0.8)²＝1－0.04＝0.96。システム全体の稼働率＝0.96×0.9＝0.864≒0.86です。"},

{q:"関数binaryToIntegerは，1桁以上の符号なし2進数を文字列で表した値を引数binaryStrで受け取り，その値を整数に変換した結果を戻り値とする。例えば，引数として“100”を受け取ると，4を返す。プログラム中のa，bに入れる字句の適切な組合せはどれか。\n\n〔プログラム〕\n整数型：binaryToInteger(文字列型：binaryStr)\n　整数型：integerNum，digitNum，exponent，i\n　integerNum←0\n　for(iを1からbinaryStrの文字数まで1ずつ増やす)\n　　digitNum←binaryStrの末尾からi番目の文字を整数型に変換した値\n　　exponent←［a］\n　　integerNum←［b］\n　endfor\n　return integerNum",
c:["(2のi乗)－1 ／ integerNum×digitNum×exponent","(2のi乗)－1 ／ integerNum＋digitNum×exponent","2の(i－1)乗 ／ integerNum×digitNum×exponent","2の(i－1)乗 ／ integerNum＋digitNum×exponent"],a:3,
e:"binaryStrの末尾からi番目の文字が2進数の下からi桁目に対応するため，その桁の重みexponentは2の(i－1)乗となります。integerNumは各桁の値と重みの積を順に加算して求めるため，integerNum←integerNum＋digitNum×exponentとなります。"},

{q:"システムの利用者認証に関する記述のうち，適切なものはどれか。",

{q:"Aさんは次のように宛先を指定して電子メールを送信した。この電子メールの受信者に関する記述のうち，適切なものだけを全て挙げたものはどれか。\n\nTo:Bさんのメールアドレス　Cc:Cさんのメールアドレス　Bcc:Dさんのメールアドレス，Eさんのメールアドレス\n\n(1)CさんはDさんのメールアドレスを知ることができる。\n(2)DさんはCさんのメールアドレスを知ることができる。\n(3)EさんはDさんのメールアドレスを知ることができる。",

{q:"正しいURLを指定してインターネット上のWebサイトへアクセスしようとした利用者が，偽装されたWebサイトに接続されてしまうようになった。原因を調べたところ，ドメイン名とIPアドレスの対応付けを管理するサーバに脆弱性があり，攻撃者によって，ドメイン名とIPアドレスを対応付ける情報が書き換えられていた。このサーバが受けた攻撃はどれか。",
c:["DDoS攻撃","DNSキャッシュポイズニング","ソーシャルエンジニアリング","ドライブバイダウンロード"],a:1,
e:"DNSサーバのドメイン名とIPアドレスの対応情報を書き換える攻撃はDNSキャッシュポイズニングです。"}
];

const QDATA = { r8: Q_R8, r7: Q_R7, r6: Q_R6 };
const YEAR_LABEL = { r8: "令和8年度", r7: "令和7年度", r6: "令和6年度" };

let currentYear = "r8";
let Q = QDATA[currentYear];

// 進捗保持
let idx = 0;
let selected = new Array(Q.length).fill(null);
let answeredCorrect = new Array(Q.length).fill(null);

const qtextEl = document.getElementById('qtext');
const choicesEl = document.getElementById('choices');
const resultBox = document.getElementById('resultBox');
const resultTitle = document.getElementById('resultTitle');
const resultExp = document.getElementById('resultExp');
const qnoLabel = document.getElementById('qnoLabel');
const curNo = document.getElementById('curNo');
const scoreNo = document.getElementById('scoreNo');
const progressBar = document.getElementById('progressBar');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const jumpSelect = document.getElementById('jumpSelect');
const quizCard = document.getElementById('quizCard');
const finishCard = document.getElementById('finishCard');
const finalScore = document.getElementById('finalScore');
const finalComment = document.getElementById('finalComment');
const restartBtn = document.getElementById('restartBtn');
const yearSelect = document.getElementById('yearSelect');
const subtitleEl = document.querySelector('.subtitle');

const labels = ['ア','イ','ウ','エ'];

function buildJumpOptions(){
  jumpSelect.innerHTML = '';
  for(let i=0;i<Q.length;i++){
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = '問' + (i+1);
    jumpSelect.appendChild(opt);
  }
}

function updateScore(){
  let s = 0;
  for(let i=0;i<Q.length;i++){ if(answeredCorrect[i]===true) s++; }
  scoreNo.textContent = s;
  return s;
}

function render(){
  const item = Q[idx];
  qnoLabel.textContent = '問' + (idx+1);
  curNo.textContent = (idx+1);
  jumpSelect.value = idx;
  qtextEl.textContent = item.q;
  choicesEl.innerHTML = '';
  progressBar.style.width = ((idx)/ (Q.length-1) * 100) + '%';

  item.c.forEach((choiceText, i)=>{
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = '<span class="label">' + labels[i] + '</span><span>' + choiceText.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
    div.addEventListener('click', ()=> onSelect(i));
    choicesEl.appendChild(div);
  });

  resultBox.className = 'result-box';
  resultBox.style.display = 'none';

  if(selected[idx] !== null){
    revealAnswer(selected[idx]);
  }

  updateScore();
  prevBtn.disabled = (idx===0);
  nextBtn.textContent = (idx===Q.length-1) ? '結果を見る' : '次の問題 →';
}

function onSelect(i){
  if(selected[idx] !== null) return; // 既に回答済みなら無視
  selected[idx] = i;
  const item = Q[idx];
  answeredCorrect[idx] = (i === item.a);
  revealAnswer(i);
  updateScore();
}

function revealAnswer(chosenIndex){
  const item = Q[idx];
  const choiceDivs = choicesEl.querySelectorAll('.choice');
  choiceDivs.forEach((div, i)=>{
    div.classList.add('disabled');
    if(i === item.a){
      div.classList.add('correct');
    } else if(i === chosenIndex){
      div.classList.add('wrong');
    }
  });
  const isCorrect = (chosenIndex === item.a);
  resultBox.style.display = 'block';
  resultBox.classList.remove('ok','ng');
  resultBox.classList.add(isCorrect ? 'ok' : 'ng');
  resultTitle.classList.remove('ok','ng');
  resultTitle.classList.add(isCorrect ? 'ok' : 'ng');
  resultTitle.textContent = isCorrect ? '正解！' : ('不正解（正解：' + labels[item.a] + '）');
  resultExp.textContent = item.e;
}

function goNext(){
  if(idx < Q.length-1){
    idx++;
    render();
    quizCard.scrollIntoView({behavior:'smooth', block:'start'});
  } else {
    showFinish();
  }
}
function goPrev(){
  if(idx>0){
    idx--;
    render();
    quizCard.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function showFinish(){
  quizCard.style.display = 'none';
  finishCard.style.display = 'block';
  const s = updateScore();
  finalScore.textContent = s;
  let comment = '';
  if(s >= 80) comment = '素晴らしい成績です！本番も自信を持って臨めそうですね。';
  else if(s >= 60) comment = '合格ライン(600点相当)を意識しつつ，間違えた分野を復習しましょう。';
  else comment = 'まだ伸びしろがあります。間違えた問題の解説を読み返して弱点を潰しましょう。';
  finalComment.textContent = comment;
}

function loadYear(year){
  currentYear = year;
  Q = QDATA[year];
  idx = 0;
  selected = new Array(Q.length).fill(null);
  answeredCorrect = new Array(Q.length).fill(null);
  subtitleEl.textContent = YEAR_LABEL[year] + ' 一問一答形式（問1〜問100）／出典：独立行政法人情報処理推進機構（IPA）公開問題';
  finishCard.style.display = 'none';
  quizCard.style.display = 'block';
  buildJumpOptions();
  render();
}

restartBtn.addEventListener('click', ()=>{
  idx = 0;
  selected = new Array(Q.length).fill(null);
  answeredCorrect = new Array(Q.length).fill(null);
  finishCard.style.display = 'none';
  quizCard.style.display = 'block';
  render();
});

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
jumpSelect.addEventListener('change', (e)=>{
  idx = parseInt(e.target.value, 10);
  render();
});
yearSelect.addEventListener('change', (e)=>{
  loadYear(e.target.value);
});

loadYear(currentYear);
</script>
</body>
</html>
